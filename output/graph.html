cio.tqdm(range(*args), **kwargs)`.\n    \"\"\"\n    return tqdm_asyncio(range(*args), **kwargs)"}, {"id": "tqdm.auto", "type": "module", "name": "auto", "qualname": "tqdm.auto", "module": "tqdm.auto", "file": "tqdm/auto.py", "line": 1, "end_line": 40, "docstring": "Enables multiple commonly used features.\n\nMethod resolution order:\n\n- `tqdm.autonotebook` without import warnings\n- `tqdm.asyncio`\n- `tqdm.std` base class\n\nUsage:\n>>> from tqdm.auto import trange, tqdm\n>>> for i in trange(10):\n...     ...", "code": "\"\"\"\nEnables multiple commonly used features.\n\nMethod resolution order:\n\n- `tqdm.autonotebook` without import warnings\n- `tqdm.asyncio`\n- `tqdm.std` base class\n\nUsage:\n>>> from tqdm.auto import trange, tqdm\n>>> for i in trange(10):\n...     ...\n\"\"\"\nimport warnings\n\nfrom .std import TqdmExperimentalWarning\n\nwith warnings.catch_warnings():\n    warnings.simplefilter(\"ignore\", category=TqdmExperimentalWarning)\n    from .autonotebook import tqdm as notebook_tqdm\n\nfrom .asyncio import tqdm as asyncio_tqdm\nfrom .std import tqdm as std_tqdm\n\nif notebook_tqdm != std_tqdm:\n    class tqdm(notebook_tqdm, asyncio_tqdm):  # pylint: disable=inconsistent-mro\n        pass\nelse:\n    tqdm = asyncio_tqdm\n\n\ndef trange(*args, **kwargs):\n    \"\"\"\n    A shortcut for `tqdm.auto.tqdm(range(*args), **kwargs)`.\n    \"\"\"\n    return tqdm(range(*args), **kwargs)\n\n\n__all__ = [\"tqdm\", \"trange\"]\n", "external_imports": ["warnings"]}, {"id": "tqdm.auto:tqdm", "type": "class", "name": "tqdm", "qualname": "tqdm", "module": "tqdm.auto", "file": "tqdm/auto.py", "line": 27, "end_line": 28, "docstring": null, "code": "    class tqdm(notebook_tqdm, asyncio_tqdm):  # pylint: disable=inconsistent-mro\n        pass"}, {"id": "tqdm.auto:trange", "type": "function", "name": "trange", "qualname": "trange", "module": "tqdm.auto", "file": "tqdm/auto.py", "line": 33, "end_line": 37, "docstring": "A shortcut for `tqdm.auto.tqdm(range(*args), **kwar e\n                    callback_len = True\n                posix_pipe(stdin, stdout, delim, buf_size, callback, callback_len)"}, {"id": "tqdm.contrib", "type": "module", "name": "contrib", "qualname": "tqdm.contrib", "module": "tqdm.contrib", "file": "tqdm/contrib/__init__.py", "line": 1, "end_line": 91, "docstring": "Thin wrappers around common functions.\n\nSubpackages contain potentially unstable extensions.", "code": "\"\"\"\nThin wrappers around common functions.\n\nSubpackages contain potentially unstable extensions.\n\"\"\"\nfrom warnings import warn\n\nfrom ..auto import tqdm as tqdm_auto\nfrom ..std import TqdmDeprecationWarning, tqdm\nfrom ..utils import ObjectWrapper\n\n__author__ = {\"github.com/\": [\"casperdcl\"]}\n__all__ = ['tenumerate', 'tzip', 'tmap']\n\n\nclass DummyTqdmFile(ObjectWrapper):\n    \"\"\"Dummy file-like that will write to tqdm\"\"\"\n\n    def __init__(self, wrapped):\n        super().__init__(wrapped)\n        self._buf = []\n\n    def write(self, x, nolock=False):\n        nl = b\"\\n\" if isinstance(x, bytes) else \"\\n\"\n        pre, sep, post = x.rpartition(nl)\n        if sep:\n            blank = type(nl)()\n            tqdm.write(blank.join(self._buf + [pre, sep]),\n                       end=blank, file=self._wrapped, nolock=nolock)\n            self._buf = [post]\n        else:\n            self._buf.append(x)\n\n    def __del__(self):\n        if self._buf:\n            blank = type(self._buf[0])()\n            try:\n                tqdm.write(blank.join(self._buf), end=blank, file=self._wrapped)\n            except (OSError, ValueError):\n                pass\n\n\ndef builtin_iterable(func):\n    \"\"\"Returns `func`\"\"\"\n    warn(\"This function has no effect, and will be removed in tqdm==5.0.0\",\n         TqdmDeprecationWarning, stacklevel=2)\n    return func\n\n\ndef tenumerate(iterable, start=0, total=None, tqdm_class=tqdm_auto, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `numpy.ndenumerate` or builtin `enumerate`.\n\n    Parameters\n    ----------\n    tqdm_class  : [default: tqdm.auto.tqdm].\n    \"\"\"\n    try:\n        import numpy as np\n    except ImportError:\n        pass\n    else:\n        if isinstance(iterable, np.ndarray):\n            return tqdm_class(np.ndenumerate(iterable), total=total or iterable.size,\n                              **tqdm_kwargs)\n    return enumerate(tqdm_class(iterable, total=total, **tqdm_kwargs), start)\n\n\ndef tzip(iter1, *iter2plus, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of builtin `zip`.\n\n    Parameters\n    ----------\n    tqdm_class  : [default: tqdm.auto.tqdm].\n    \"\"\"\n    kwargs = tqdm_kwargs.copy()\n    tqdm_class = kwargs.pop(\"tqdm_class\", tqdm_auto)\n    yield from zip(tqdm_class(iter1, **kwargs), *iter2plus)\n\n\ndef tmap(function, *sequences, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of builtin `map`.\n\n    Parameters\n    ----------\n    tqdm_class  : [default: tqdm.auto.tqdm].\n    \"\"\"\n    for i in tzip(*sequences, **tqdm_kwargs):\n        yield function(*i)\n", "external_imports": ["numpy", "warnings"]}, {"id": "tqdm.contrib:DummyTqdmFile", "type": "class", "name": "DummyTqdmFile", "qualname": "DummyTqdmFile", "module": "tqdm.contrib", "file": "tqdm/contrib/__init__.py", "line": 16, "end_line": 40, "docstring": "Dummy file-like that will write to tqdm", "code": "class DummyTqdmFile(ObjectWrapper):\n    \"\"\"Dummy file-like that will write to tqdm\"\"\"\n\n    def __init__(self, wrapped):\n        super().__init__(wrapped)\n        self._buf = []\n\n    def write(self, x, nolock=False):\n        nl = b\"\\n\" if isinstance(x, bytes) else \"\\n\"\n        pre, sep, post = x.rpartition(nl)\n        if sep:\n            blank = type(nl)()\n            tqdm.write(blank.join(self._buf + [pre, sep]),\n                       end=blank, file=self._wrapped, nolock=nolock)\n            self._buf = [post]\n        else:\n            self._buf.append(x)\n\n    def __del__(self):\n        if self._buf:\n tmap(function, *sequences, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of builtin `map`.\n\n    Parameters\n    ----------\n    tqdm_class  : [default: tqdm.auto.tqdm].\n    \"\"\"\n    for i in tzip(*sequences, **tqdm_kwargs):\n        yield function(*i)"}, {"id": "tqdm.contrib.bells", "type": "module", "name": "bells", "qualname": "tqdm.contrib.bells", "module": "tqdm.contrib.bells", "file": "tqdm/contrib/bells.py", "line": 1, "end_line": 28, "docstring": "Even more features than `tqdm.auto` (all the bells & whistles):\n\n- `tqdm.auto`\n- `tqdm.tqdm.pandas`\n- `tqdm.contrib.slack`\n    + uses `${TQDM_SLACK_TOKEN}` and `${TQDM_SLACK_CHANNEL}`\n- `tqdm.contrib.telegram`\n    + uses `${TQDM_TELEGRAM_TOKEN}` and `${TQDM_TELEGRAM_CHAT_ID}`\n- `tqdm.contrib.discord`\n    + uses `${TQDM_DISCORD_TOKEN}` and `${TQDM_DISCORD_CHANNEL_ID}`", "code": "\"\"\"\nEven more features than `tqdm.auto` (all the bells & whistles):\n\n- `tqdm.auto`\n- `tqdm.tqdm.pandas`\n- `tqdm.contrib.slack`\n    + uses `${TQDM_SLACK_TOKEN}` and `${TQDM_SLACK_CHANNEL}`\n- `tqdm.contrib.telegram`\n    + uses `${TQDM_TELEGRAM_TOKEN}` and `${TQDM_TELEGRAM_CHAT_ID}`\n- `tqdm.contrib.discord`\n    + uses `${TQDM_DISCORD_TOKEN}` and `${TQDM_DISCORD_CHANNEL_ID}`\n\"\"\"\n__all__ = ['tqdm', 'trange']\nimport warnings\nfrom os import getenv\n\nif getenv(\"TQDM_SLACK_TOKEN\") and getenv(\"TQDM_SLACK_CHANNEL\"):\n    from .slack import tqdm, trange\nelif getenv(\"TQDM_TELEGRAM_TOKEN\") and getenv(\"TQDM_TELEGRAM_CHAT_ID\"):\n    from .telegram import tqdm, trange\nelif getenv(\"TQDM_DISCORD_TOKEN\") and getenv(\"TQDM_DISCORD_CHANNEL_ID\"):\n    from .discord import tqdm, trange\nelse:\n    from ..auto import tqdm, trange\n\nwith warnings.catch_warnings():\n    warnings.simplefilter(\"ignore\", category=FutureWarning)\n    tqdm.pandas()\n", "external_imports": ["os", "warnings"]}, {"id": "tqdm.contrib.concurrent", "type": "module", "name": "concurrent", "qualname": "tqdm.contrib.concurrent", "module": "tqdm.contrib.concurrent", "file": "tqdm/contrib/concurrent.py", "line": 1, "end_line": 259, "docstring": "Thin wrappers around `concurrent.futures`.", "code": "\"\"\"\nThin wrappers around `concurrent.futures`.\n\"\"\"\nimport sys\nfrom contextlib import contextmanager\nfrom operator import length_hint\n\nfrom ..auto import tqdm as tqdm_auto\nfrom ..std import TqdmWarning\n\n__author__ = {\"github.com/\": [\"casperdcl\"]}\n__all__ = ['thread_map', 'process_map', 'interpreter_map']\n\n\nclass _InterpreterLock:\n    \"\"\"Reentrant lock backed by a cross-interpreter queue.\"\"\"\n    from threading import get_ident\n    from time import monotonic as _time\n\n    def __init__(self, queue):\n        from threading import RLock\n        self._queue = queue\n        self._lock = RLock()\n        self._owner = None\n        self._depth = 0\n\n    def acquire(self, blocking=True, timeout=-1):\n        from queue import Empty\n        start = self._time()\n        if timeout == -1:\n            acquired = self._lock.acquire(blocking)\n        else:\n            acquired = self._lock.acquire(blocking, timeout)\n        if not acquired:\n            return False\n        if self._depth:\n            self._depth += 1\n            return True\n        try:\n            if not blocking:\n                self._queue.get_nowait()\n            elif timeout == -1:\n                self._queue.get()\n            else:\n                remaining = max(0, timeout - (self._time() - start))\n                self._queue.get(timeout=remaining)\n        except Empty:\n            self._lock.release()\n            return False\n        self._owner = self.get_ident()\n        self._depth = 1\n        return True\n\n    def release(self):\n        if self._owner != self.get_ident():\n            raise RuntimeError(\"cannot release un-acquired lock\")\n        self._depth -= 1\n        if not self._depth:\n            self._owner = None\n            self._queue.put(None)\n        self._lock.release()\n\n    def __enter__(self):\n        self.acquire()\n        return self\n\n    def __exit__(self, *exc):\n        self.release()\n\n\n@contextmanager\ndef ensure_lock(tqdm_class, lock_name=\"\", lock=None):\n    \"\"\"get (create if necessary) and then restore `tqdm_class`'s lock\"\"\"\n    old_lock = getattr(tqdm_class, '_lock', None)  # don't create a new lock\n    if lock is None:\n        lock = old_lock or tqdm_class.get_lock()  # maybe create a new lock\n    lock = getattr(lock, lock_name, lock)  # maybe subtype\n    tqdm_class.set_lock(lock)\n    yield lock\n    if old_lock is None:\n        del tqdm_class._lock\n    else:\n        tqdm_class.set_lock(old_lock)\n\n\ndef _get_interpreter_init(tqdm_class, lock_queue_id):\n    \"\"\"Return an initializer which bootstraps the parent import path and lock.\"\"\"\n    code = (\n        \"import sys\\n\"\n        f\"sys.path[:] = {sys.path!r}\\n\"\n        \"from concurrent import interpreters\\n\"\n        \"from importlib import import_module\\n\"\n        \"from tqdm.contrib.concurrent import _InterpreterLock\\n\"\n        f\"tqdm_class = import_module({tqdm_class.__module__!r})\\n\"\n        f\"for name in {tqdm_class.__qualname__.split('.')!r}:\\n\"\n        \"    tqdm_class = getattr(tqdm_class, name)\\n\"\n        \"tqdm_class.monitor_interval = 0\\n\"\n        f\"tqdm_class.set_lock(_InterpreterLock(interpreters.Queue({lock_queue_id!r})))\")\n    return exec, (code,)\n\n\ndef _min_map_len(iterables):\n    \"\"\"min(map(length_hint, iterables), default=0)\"\"\"\n    return min((n for it in iterables if (n := length_hint(it, -1)) >= 0), default=0)\n\n\ndef _executor_map(\n    PoolExecutor, fn, *iterables, max_workers=None, timeout=None, chunksize=1, lock_name=\"\",\n    tqdm_class=tqdm_auto, smoothing=0.0, _lock=None, _initializer=None, _initargs=None,\n    **tqdm_kwargs\n):\n    \"\"\"\n    Implementation of `thread_map`, `process_map` and `interpreter_map`.\n\n    Parameters\n    ----------\n    max_workers  : int\n    timeout  : int\n    buffersize  : int\n        Requires Python>=3.14.\n    thread_name_prefix  : str\n    max_tasks_per_child  : int\n    mp_context  : str\n    \"\"\"\n    kwargs = tqdm_kwargs.copy()\n    if 'total' not in kwargs:\n        kwargs['total'] = _min_map_len(iterables)\n    map_kwargs = {}\n    if 'buffersize' in kwargs:\n        map_kwargs['buffersize'] = kwargs.pop('buffersize')\n    pool_kwargs = {}\n    for k in ('thread_name_prefix', 'max_tasks_per_child', 'mp_context'):\n        if k in kwargs:\n            pool_kwargs[k] = kwargs.pop(k)\n    dynamic_miniters = None\n    if kwargs['total'] and 'miniters' not in kwargs:\n        try:\n            from os import process_cpu_count as cpu_count\n        except ImportError:\n            from os import cpu_count\n        # thread & process pools have different default workers, but we KISS here\n        rough_max = max_workers or min(32, (cpu_count() or 1) + 4)\n        if kwargs['total'] > rough_max:\n            kwargs['miniters'] = rough_max\n            dynamic_miniters = True\n    with ensure_lock(tqdm_class, lock_name=lock_name, lock=_lock) as lk:\n        # share lock in case workers are already using `tqdm`\n        if _initializer is None:\n            _initializer = tqdm_class.set_lock\n            _initargs = (lk,)\n        with PoolExecutor(max_workers=max_workers, initializer=_initializer, initargs=_initargs,\n                          **pool_kwargs) as ex:\n            with tqdm_class(smoothing=smoothing, **kwargs) as pbar:\n                if dynamic_miniters is not None:\n                    pbar.dynamic_miniters = True\n                orisubmit = ex.submit\n\n                def patchsubmit(*args, **kwargs):\n                    fut = orisubmit(*args, **kwargs)\n                    fut.add_done_callback(lambda _: pbar.update())\n                    return fut\n                ex.submit = patchsubmit\n                return list(ex.map(\n                    fn, *iterables, timeout=timeout, chunksize=chunksize, **map_kwargs))\n\n\ndef thread_map(fn, *iterables, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `list(map(fn, *iterables))`\n    driven by `concurrent.futures.ThreadPoolExecutor`.\n\n    Parameters\n    ----------\n    max_workers  : int, optional\n        Maximum number of workers to spawn; passed to `concurrent.futures.ThreadPoolExecutor`.\n    thread_name_prefix  : str, optional\n        Passed to `concurrent.futures.ThreadPoolExecutor` [default: ''].\n    timeout  : int or float, optional\n        Seconds to wait before raising `TimeoutError` if `__next__` is called and the\n        result isn't available. [default: None].\n    buffersize  : int, optional\n        Requires Python>=3.14 [default: None].\n    tqdm_class  : optional\n        `tqdm` class to use for bars [default: tqdm.auto.tqdm].\n    smoothing  : float, optional\n        Passed to `tqdm_class`; the [default: 0] is average (due to erratic update frequency).\n    lock_name  : str, optional\n        Member of `tqdm_class.get_lock()` to use [default: ''].\n    \"\"\"\n    from concurrent.futures import ThreadPoolExecutor\n    return _executor_map(ThreadPoolExecutor, fn, *iterables, **tqdm_kwargs)\n\n\ndef interpreter_map(fn, *iterables, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `list(map(fn, *iterables))`\n    driven by `concurrent.futures.InterpreterPoolExecutor` (Python 3.14+).\n\n    Parameters\n    ----------\n    Same as `thread_map`.\n\n    Notes\n    -----\n    `fn`, its arguments, and its return values must be pickleable.\n    Worker progress bars using the same `tqdm_class` share a cross-interpreter write lock.\n    \"\"\"\n    from concurrent import interpreters\n    from concurrent.futures import InterpreterPoolExecutor\n    lock_queue = interpreters.create_queue()\n    lock_queue.put(None)\n    tqdm_class = tqdm_kwargs.get(\"tqdm_class\", tqdm_auto)\n    initializer, initargs = _get_interpreter_init(tqdm_class, lock_queue.id)\n    return _executor_map(\n        InterpreterPoolExecutor, fn, *iterables, _lock=_InterpreterLock(lock_queue),\n        _initializer=initializer, _initargs=initargs, **tqdm_kwargs)\n\n\ndef process_map(fn, *iterables, lock_name=\"mp_lock\", **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `list(map(fn, *iterables))`\n    driven by `concurrent.futures.ProcessPoolExecutor`.\n\n    Parameters\n    ----------\n    max_workers  : int, optional\n        Maximum number of workers to spawn; passed to `concurrent.futures.ProcessPoolExecutor`.\n    timeout  : int or float, optional\n        Seconds to wait before raising `TimeoutError` if `__next__` is called and the\n        result isn't available. [default: None].\n    chunksize  : int, optional\n        Approximate size of chunks sent to worker processes; passed to\n        `concurrent.futures.ProcessPoolExecutor.map`. [default: 1].\n    buffersize  : int, optional\n        Requires Python>=3.14 [default: None].\n    max_tasks_per_child  : int, optional\n        Maximum number of tasks a worker process can complete before being replaced\n        with a new process; passed to `concurrent.futures.ProcessPoolExecutor`.\n    mp_context  : multiprocessing.BaseContext, optional\n        Multiprocessing context to use, e.g. `multiprocessing.get_context('fork')`.\n    lock_name  : str, optional\n        Member of `tqdm_class.get_lock()` to use [default: mp_lock].\n    tqdm_class  : optional\n        `tqdm` class to use for bars [default: tqdm.auto.tqdm].\n    smoothing  : float, optional\n        Passed to `tqdm_class`; the [default: 0] is average (due to erratic update frequency).\n    \"\"\"\n    from concurrent.futures import ProcessPoolExecutor\n    if iterables and 'chunksize' not in tqdm_kwargs:\n        # default `chunksize=1` has poor performance for large iterables\n        # (most time spent dispatching items to workers).\n        shortest_iterable_len = _min_map_len(iterables)\n        if shortest_iterable_len > 1000:\n            from warnings ocess_map` and `interpreter_map`.\n\nParameters\n----------\nmax_workers  : int\ntimeout  : int\nbuffersize  : int\n    Requires Python>=3.14.\nthread_name_prefix  : str\nmax_tasks_per_child  : int\nmp_context  : str", "code": "def _executor_map(\n    PoolExecutor, fn, *iterables, max_workers=None, timeout=None, chunksize=1, lock_name=\"\",\n    tqdm_class=tqdm_auto, smoothing=0.0, _lock=None, _initializer=None, _initargs=None,\n    **tqdm_kwargs\n):\n    \"\"\"\n    Implementation of `thread_map`, `process_map` and `interpreter_map`.\n\n    Parameters\n    ----------\n    max_workers  : int\n    timeout  : int\n    buffersize  : int\n        Requires Python>=3.14.\n    thread_name_prefix  : str\n    max_tasks_per_child  : int\n    mp_context  : str\n    \"\"\"\n    kwargs = tqdm_kwargs.copy()\n    if 'total' not in kwargs:\n        kwargs['total'] = _min_map_len(iterables)\n    map_kwargs = {}\n    if 'buffersize' in kwargs:\n        map_kwargs['buffersize'] = kwargs.pop('buffersize')\n    pool_kwargs = {}\n    for k in ('thread_name_prefix', 'max_tasks_per_child', 'mp_context'):\n        if k in kwargs:\n            pool_kwargs[k] = kwargs.pop(k)\n    dynamic_miniters = None\n    if kwargs['total'] and 'miniters' not in kwargs:\n        try:\n            from os import process_cpu_count as cpu_count\n        except ImportError:\n            from os import cpu_count\n        # thread & process pools have different default workers, but we KISS here\n        rough_max = max_workers or min(32, (cpu_count() or 1) + 4)\n        if kwargs['total'] > rough_max:\n            kwargs['miniters'] = rough_max\n            dynamic_miniters = True\n    with ensure_lock(tqdm_class, lock_name=lock_name, lock=_lock) as lk:\n        # share lock in case workers are already using `tqdm`\n        if _initializer is None:\n            _initializer = tqdm_class.set_lock\n            _initargs = (lk,)\n        with PoolExecutor(max_workers=max_workers, initializer=_initializer, initargs=_initargs,\n                          **pool_kwargs) as ex:\n            with tqdm_class(smoothing=smoothing, **kwargs) as pbar:\n                if dynamic_miniters is not None:\n                    pbar.dynamic_miniters = True\n                orisubmit = ex.submit\n\n                def patchsubmit(*args, **kwargs):\n                    fut = orisubmit(*args, **kwargs)\n                    fut.add_done_callback(lambda _: pbar.update())\n                    return fut\n                ex.submit = patchsubmit\n                return list(ex.map(\n                    fn, *iterables, timeout=timeout, chunksize=chunksize, **map_kwargs))"}, {"id": "tqdm.contrib.concurrent:thread_map", "type": "function", "name": "thread_map", "qualname": "thread_map", "module": "tqdm.contrib.concurrent", "file": "tqdm/contrib/concurrent.py", "line": 167, "end_line": 191, "docstring": "Equivalent of `list(map(fn, *iterables))`\ndriven by `concurrent.futures.ThreadPoolExecutor`.\n\nParameters\n----------\nmax_workers  : int, optional\n    Maximum number of workers to spawn; passed to `concurrent.futures.ThreadPoolExecutor`.\nthread_name_prefix  : str, optional\n    Passed to `concurrent.futures.ThreadPoolExecutor` [default: ''].\ntimeout  : int or float, optional\n    Seconds to wait before raising `TimeoutError` if `__next__` is called and the\n    result isn't available. [default: None].\nbuffersize  : int, optional\n    Requires Python>=3.14 [default: None].\ntqdm_class  : optional\n    `tqdm` class to use for bars [default: tqdm.auto.tqdm].\nsmoothing  : float, optional\n    Passed to `tqdm_class`; the [default: 0] is average (due to erratic update frequency).\nlock_name  : str, optional\n    Member of `tqdm_class.get_lock()` to use [default: ''].", "code": "def thread_map(fn, *iterables, **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `list(map(fn, *iterables))`\n    driven by `concurrent.futures.ThreadPoolExecutor`.\n\n    Parameters\n    ----------\n    max_workers  : int, optional p(fn, *iterables, lock_name=\"mp_lock\", **tqdm_kwargs):\n    \"\"\"\n    Equivalent of `list(map(fn, *iterables))`\n    driven by `concurrent.futures.ProcessPoolExecutor`.\n\n    Parameters\n    ----------\n    max_workers  : int, optional\n        Maximum number of workers to spawn; passed to `concurrent.futures.ProcessPoolExecutor`.\n    timeout  : int or float, optional\n        Seconds to wait before raising `TimeoutError` if `__next__` is called and the\n        result isn't available. [default: None].\n    chunksize  : int, optional\n        Approximate size of chunks sent to worker processes; passed to\n        `concurrent.futures.ProcessPoolExecutor.map`. [default: 1].\n    buffersize  : int, optional\n        Requires Python>=3.14 [default: None].\n    max_tasks_per_child  : int, optional\n        Maximum number of tasks a worker process can complete before being replaced\n        with a new process; passed to `concurrent.futures.ProcessPoolExecutor`.\n    mp_context  : multiprocessing.BaseContext, optional\n        Multiprocessing context to use, e.g. `multiprocessing.get_context('fork')`.\n    lock_name  : str, optional\n        Member of `tqdm_class.get_lock()` to use [default: mp_lock].\n    tqdm_class  : optional\n        `tqdm` class to use for bars [default: tqdm.auto.tqdm].\n    smoothing  : float, optional\n        Passed to `tqdm_class`; the [default: 0] is average (due to erratic update frequency).\n    \"\"\"\n    from concurrent.futures import ProcessPoolExecutor\n    if iterables and 'chunksize' not in tqdm_kwargs:\n        # default `chunksize=1` has poor performance for large iterables\n        # (most time spent dispatching items to workers).\n        shortest_iterable_len = _min_map_len(iterables)\n        if shortest_iterable_len > 1000:\n            from warnings import warn\n            warn(\"Iterable length %d > 1000 but `chunksize` is not set.\"\n                 \" This may seriously degrade multiprocess performance.\"\n                 \" Set `chunksize=1` or more.\" % shortest_iterable_len,\n                 TqdmWarning, stacklevel=2)\n    return _executor_map(ProcessPoolExecutor, fn, *iterables, lock_name=lock_name, **tqdm_kwargs)"}, {"id": "tqdm.contrib.discord", "type": "module", "name": "discord", "qualname": "tqdm.contrib.discord", "module": "tqdm.contrib.discord", "file": "tqdm/contrib/discord.py", "line": 1, "end_line": 155, "docstring": "Sends updates to a Discord bot.\n\nUsage:\n>>> from tqdm.contrib.discord import tqdm, trange\n>>> for i in trange(10, token='{token}', channel_id='{channel_id}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-discord.png)", "code": "\"\"\"\nSends updates to a Discord bot.\n\nUsage:\n>>> from tqdm.contrib.discord import tqdm, trange\n>>> for i in trange(10, token='{token}', channel_id='{channel_id}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-discord.png)\n\"\"\"\nfrom warnings import warn\n\nfrom requests import Session\nfrom requests.utils import default_user_agent\n\nfrom ..auto import tqdm as tqdm_auto\nfrom ..std import TqdmWarning\nfrom ..utils import envwrap\nfrom ..version import __version__\nfrom .utils_worker import MonoWorker\n\n__author__ = {\"github.com/\": [\"casperdcl\", \"guigoruiz1\"]}\n__all__ = ['DiscordIO', 'tqdm_discord', 'tdrange', 'tqdm', 'trange']\n\n\nclass DiscordIO(MonoWorker):\n    \"\"\"Non-blocking file-like IO using a Discord Bot.\"\"\"\n    API = 'https://discord.com/api/v10'\n    UA = f\"tqdm (https://tqdm.github.io, {__version__}) {default_user_agent()}\"\n\n    def __init__(self, token, channel_id):\n        \"\"\"Creates a new message in the given `channel_id`.\"\"\"\n        super().__init__()\n        self.token = token\n        self.channel_id = channel_id\n        self.session = Session()\n        self.text = self.__class__.__name__\n        self.message_id  # pylint: disable=pointless-statement\n\n    @property\n    def message_id(self):\n        if hasattr(self, '_message_id'):\n            return self._message_id  # pylint: disable=access-member-before-definition\n        try:\n            req = self.session.post(\n                f'{self.API}/channels/{self.channel_id}/messages',\n                headers={'Authorization': f'Bot {self.token}', 'User-Agent': self.UA},\n                json={'content': f\"`{self.text}`\"})\n            res = req.json()\n            req.raise_for_status()\n        except Exception as e:\n            if req.status_code == 429:\n                warn(\"Creation rate limit: try increasing `mininterval`.\",\n                     TqdmWarning, stacklevel=2)\n            else:\n                tqdm_auto.write(str(e))\n        else:\n            self._message_id = res['id']\n            return self._message_id\n\n    def write(self, s):\n        \"\"\"Replaces internal `message_id`'s text with `s`.\"\"\"\n        if not s:\n            s = \"...\"\n        s = s.replace('\\r', '').strip()\n        if s == self.text:\n            return  # avoid duplicate message Bot error\n        message_id = self.message_id\n        if message_id is None:\n            return\n        self.text = s\n        try:\n            future = self.submit(\n                self.session.patch,\n                f'{self.API}/channels/{self.channel_id}/messages/{message_id}',\n                headers={'Authorization': f'Bot {self.token}', 'User-Agent': self.UA},\n                json={'content': f\"`{self.text}`\"})\n        except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            return future\n\n    def delete(self):\n        \"\"\"Deletes internal `message_id`.\"\"\"\n        try:\n            future = self.submit(\n                self.session.delete,\n                f'{self.API}/channels/{self.channel_id}/messages/{self.message_id}',\n                headers={'Authorization': f'Bot {self.token}', 'User-Agent': self.UA})\n        except Exception as e:\n            tqdm_auto.write(str(e))\n \n    \"\"\"Equivalent of `itertools.permutations`.\"\"\"\n    if total is None:\n        try:\n            n = len(iterable)\n        except (TypeError, AttributeError):\n            pass\n        else:\n            r = n if r is None else r\n            if r > n:\n                total = 0\n            else:\n                total = math.perm(n, r)\n    return tqdm_class(itertools.permutations(iterable, r), total=total, **kwargs)\n\n\ndef combinations(iterable, r, total=None, tqdm_class=tqdm_auto, **kwargs):\n    \"\"\"Equivalent of `itertools.combinations`.\"\"\"\n    if total is None:\n        try:\n            n = len(iterable)\n        except (TypeError, AttributeError):\n            pass\n        else:\n            if r > n:\n                total = 0\n            else:\n                total = math.comb(n, r)\n    return tqdm_class(itertools.combinations(iterable, r), total=total, **kwargs)\n\n\ndef combinations_with_replacement(iterable, r, total=None, tqdm_class=tqdm_auto, **kwargs):\n    \"\"\"Equivalent of `itertools.combinations_with_replacement`.\"\"\"\n    if total is None:\n        try:\n            n = len(iterable)\n        except (TypeError, AttributeError):\n            pass\n        else:\n            total = 1\n            for i in range(n+r-1, n-1, -1):\n                total *= i\n            for i in range(1, r+1):\n                total //= i\n    return tqdm_class(itertools.combinations_with_replacement(iterable, r), total=total, **kwargs)\n\n\ndef batched(iterable, n, total=None, tqdm_class=tqdm_auto, **kwargs):\n    \"\"\"Equivalent of `itertools.batched`.\"\"\"\n    if total is None:\n        try:\n            total = len(iterable)\n        except (TypeError, AttributeError):\n            pass\n    return tqdm_class(itertools.batched(iterable, n), unit_scale=n,\n                      total=(total+n-1) // n if total is not None else None,\n                      **kwargs)\n", "external_imports": ["itertools", "math"]}, {"id": "tqdm.contri  `itertools.batched`.", "code": "def batched(iterable, n, total=None, tqdm_class=tqdm_auto, **kwargs):\n    \"\"\"Equivalent of `itertools.batched`.\"\"\"\n    if total is None:\n        try:\n            total = len(iterable)\n        except (TypeError, AttributeError):\n            pass\n    return tqdm_class(itertools.batched(iterable, n), unit_scale=n,\n                      total=(total+n-1) // n if total is not None else None,\n                      **kwargs)"}, {"id": "tqdm.contrib.logging", "type": "module", "name": "logging", "qualname": "tqdm.contrib.logging", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 1, "end_line": 128, "docstring": "Helper functionality for interoperability with stdlib `logging`.", "code": "\"\"\"\nHelper functionality for interoperability with stdlib `logging`.\n\"\"\"\nimport logging\nimport sys\nfrom contextlib import contextmanager\n\ntry:\n    from typing import Iterator, List, Optional, Type  # noqa: F401, pylint: disable=unused-import\nexcept ImportError:\n    pass\n\nfrom ..std import tqdm as std_tqdm\n\n\nclass _TqdmLoggingHandler(logging.StreamHandler):\n    def __init__(\n        self,\n        tqdm_class=std_tqdm  # type: Type[std_tqdm]\n    ):\n        super().__init__()\n        self.tqdm_class = tqdm_class\n\n    def emit(self, record):\n        try:\n            msg = self.format(record)\n            self.tqdm_class.write(msg, file=self.stream)\n            self.flush()\n        except (KeyboardInterrupt, SystemExit):\n            raise\n        except:  # noqa pylint: disable=bare-except\n            self.handleError(record)\n\n\ndef _is_console_logging_handler(handler):\n    return (isinstance(handler, logging.StreamHandler)\n            and handler.stream in {sys.stdout, sys.stderr})\n\n\ndef _get_first_found_console_logging_handler(handlers):\n    for handler in handlers:\n        if _is_console_logging_handler(handler):\n            return handler\n\n\n@contextmanager\ndef logging_redirect_tqdm(\n    loggers=None,  # type: Optional[List[logging.Logger]],\n    tqdm_class=std_tqdm  # type: Type[std_tqdm]\n):\n    # type: (...) -> Iterator[None]\n    \"\"\"\n    Context manager redirecting console logging to `tqdm.write()`, leaving\n    other logging handlers (e.g. log files) unaffected.\n\n    Parameters\n    ----------\n    loggers  : list, optional\n      Which handlers to redirect (default: [logging.root]).\n    tqdm_class  : optional\n\n    Example\n    -------\n    ```python\n    import logging\n    from tqdm import trange\n    from tqdm.contrib.logging import logging_redirect_tqdm\n\n    LOG = logging.getLogger(__name__)\n\n    if __name__ == '__main__':\n        logging.basicConfig(level=logging.INFO)\n        with logging_redirect_tqdm():\n            for i in trange(9):\n                if i == 4:\n                    LOG.info(\"console logging redirected to `tqdm.write()`\")\n        # logging restored\n    ```\n    \"\"\"\n    if loggers is None:\n        loggers = [logging.root]\n    original_handlers_list = [logger.handlers for logger in loggers]\n    try:\n        for logger in loggers:\n            tqdm_handler = _TqdmLoggingHandler(tqdm_class)\n            orig_handler = _get_first_found_console_logging_handler(logger.handlers)\n            if orig_handler is not None:\n                tqdm_handler.setFormatter(orig_handler.formatter)\n                tqdm_handler.stream = orig_handler.stream\n                for log_filter in orig_handler.filters:\n                    tqdm_handler.addFilter(log_filter)\n            logger.handlers = [\n                handler for handler in logger.handlers\n                if not _is_console_logging_handler(handler)] + [tqdm_handler]\n        yield\n    finally:\n        for logger, original_handlers in zip(loggers, original_handlers_list):\n            logger.handlers = original_handlers\n\n\n@contextmanager\ndef tqdm_logging_redirect(\n    *args,\n    # loggers=None,  # type: Optional[List[logging.Logger]]\n    # tqdm=None,  # type: Optional[Type[tqdm.tqdm]]\n    **kwargs\n):\n    # type: (...) -> Iterator[None]\n    \"\"\"\n    Convenience shortcut for:\n    ```python\n    with tqdm_class(*args, **tqdm_kwargs) as pbar:\n        with logging_redirect_tqdm(loggers=loggers, tqdm_class=tqdm_class):\n            yield pbar\n    ```\n\n    Parameters\n    ----------\n    tqdm_class  : optional, (default: tqdm.std.tqdm).\n    loggers  : optional, list.\n    **tqdm_kwargs  : passed to `tqdm_class`.\n    \"\"\"\n    tqdm_kwargs = kwargs.copy()\n    loggers = tqdm_kwargs.pop('loggers', None)\n    tqdm_class = tqdm_kwargs.pop('tqdm_class', std_tqdm)\n    with tqdm_class(*args, **tqdm_kwargs) as pbar:\n        with logging_redirect_tqdm(loggers=loggers, tqdm_class=tqdm_class):\n            yield pbar\n", "external_imports": ["contextlib", "logging", "sys", "typing"]}, {"id": "tqdm.contrib.logging:_TqdmLoggingHandler", "type": "class", "name": "_TqdmLoggingHandler", "qualname": "_TqdmLoggingHandler", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 16, "end_line": 32, "docstring": null, "code": "class _TqdmLoggingHandler(logging.StreamHandler):\n    def __init__(\n        self,\n        tqdm_class=std_tqdm  # type: Type[std_tqdm]\n    ):\n        super().__init__()\n        self.tqdm_class = tqdm_class\n\n    def emit(self, record):\n        try:\n            msg = self.format(record)\n            self.tqdm_class.write(msg, file=self.stream)\n            self.flush()\n        except (KeyboardInterrupt, SystemExit):\n            raise\n        except:  # noqa pylint: disable=bare-except\n            self.handleError(record)", "external_bases": ["logging.StreamHandler"]}, {"id": "tqdm.contrib.logging:_TqdmLoggingHandler.__init__", "type": "method", "name": "__init__", "qualname": "_TqdmLoggingHandler.__init__", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 17, "end_line": 22, "docstring": null, "code": "    def __init__(\n        self,\n        tqdm_class=std_tqdm  # type: Type[std_tqdm]\n    ):\n        super().__init__()\n        self.tqdm_class = tqdm_class"}, {"id": "tqdm.contrib.logging:_TqdmLoggingHandler.emit", "type": "method", "name": "emit", "qualname": "_TqdmLoggingHandler.emit", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 24, "end_line": 32, "docstring": null, "code": "    def emit(self, record):\n        try:\n            msg = self.format(record)\n            self.tqdm_class.write(msg, file=self.stream)\n            self.flush()\n        except (KeyboardInterrupt, SystemExit):\n            raise\n        except:  # noqa pylint: disable=bare-except\n            self.handleError(record)"}, {"id": "tqdm.contrib.logging:_is_console_logging_handler", "type": "function", "name": "_is_console_logging_handler", "qualname": "_is_console_logging_handler", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 35, "end_line": 37, "docstring": null, "code": "def _is_console_logging_handler(handler):\n    return (isinstance(handler, logging.StreamHandler)\n            and handler.stream in {sys.stdout, sys.stderr})"}, {"id": "tqdm.contrib.logging:_get_first_found_console_logging_handler", "type": "function", "name": "_get_first_found_console_logging_handler", "qualname": "_get_first_found_console_logging_handler", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 40, "end_line": 43, "docstring": null, "code": "def _get_first_found_console_logging_handler(handlers):\n    for handler in handlers:\n        if _is_console_logging_handler(handler):\n            return handler"}, {"id": "tqdm.contrib.logging:logging_redirect_tqdm", "type": "function", "name": "logging_redirect_tqdm", "qualname": "logging_redirect_tqdm", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 47, "end_line": 98, "docstring": "Context manager redirecting console logging to `tqdm.write()`, leaving\nother logging handlers (e.g. log files) unaffected.\n\nParameters\n----------\nloggers  : list, optional\n  Which handlers to redirect (default: [logging.root]).\ntqdm_class  : optional\n\nExample\n-------\n```python\nimport logging\nfrom tqdm import trange\nfrom tqdm.contrib.logging import logging_redirect_tqdm\n\nLOG = logging.getLogger(__name__)\n\nif __name__ == '__main__':\n    logging.basicConfig(level=logging.INFO)\n    with logging_redirect_tqdm():\n        for i in trange(9):\n            if i == 4:\n                LOG.info(\"console logging redirected to `tqdm.write()`\")\n    # logging restored\n```", "code": "@contextmanager\ndef logging_redirect_tqdm(\n    loggers=None,  # type: Optional[List[logging.Logger]],\n    tqdm_class=std_tqdm  # type: Type[std_tqdm]\n):\n    # type: (...) -> Iterator[None]\n    \"\"\"\n    Context manager redirecting console logging to `tqdm.write()`, leaving\n    other logging handlers (e.g. log files) unaffected.\n\n    Parameters\n    ----------\n    loggers  : list, optional\n      Which handlers to redirect (default: [logging.root]).\n    tqdm_class  : optional\n\n    Example\n    -------\n    ```python\n    import logging\n    from tqdm import trange\n    from tqdm.contrib.logging import logging_redirect_tqdm\n\n    LOG = logging.getLogger(__name__)\n\n    if __name__ == '__main__':\n        logging.basicConfig(level=logging.INFO)\n        with logging_redirect_tqdm():\n            for i in trange(9):\n                if i == 4:\n                    LOG.info(\"console logging redirected to `tqdm.write()`\")\n        # logging restored\n    ```\n    \"\"\"\n    if loggers is None:\n        loggers = [logging.root]\n    original_handlers_list = [logger.handlers for logger in loggers]\n    try:\n        for logger in loggers:\n            tqdm_handler = _TqdmLoggingHandler(tqdm_class)\n            orig_handler = _get_first_found_console_logging_handler(logger.handlers)\n            if orig_handler is not None:\n                tqdm_handler.setFormatter(orig_handler.formatter)\n                tqdm_handler.stream = orig_handler.stream\n                for log_filter in orig_handler.filters:\n                    tqdm_handler.addFilter(log_filter)\n            logger.handlers = [\n                handler for handler in logger.handlers\n                if not _is_console_logging_handler(handler)] + [tqdm_handler]\n        yield\n    finally:\n        for logger, original_handlers in zip(loggers, original_handlers_list):\n            logger.handlers = original_handlers"}, {"id": "tqdm.contrib.logging:tqdm_logging_redirect", "type": "function", "name": "tqdm_logging_redirect", "qualname": "tqdm_logging_redirect", "module": "tqdm.contrib.logging", "file": "tqdm/contrib/logging.py", "line": 102, "end_line": 128, "docstring": "Convenience shortcut for:\n```python\nwith tqdm_class(*args, **tqdm_kwargs) as pbar:\n    with logging_redirect_tqdm(loggers=loggers, tqdm_class=tqdm_class):\n        yield pbar\n```\n\nParameters\n----------\ntqdm_class  : optional, (default: tqdm.std.tqdm).\nloggers  : optional, list.\n**tqdm_kwargs  : passed to `tqdm_class`.", "code": "@contextmanager\ndef tqdm_logging_redirect(\n    *args,\n    # loggers=None,  # type: Optional[List[logging.Logger]]\n    # tqdm=None,  # type: Optional[Type[tqdm.tqdm]]\n    **kwargs\n):\n    # type: (...) -> Iterator[None]\n    \"\"\"\n    Convenience shortcut for:\n    ```python\n    with tqdm_class(*args, **tqdm_kwargs) as pbar:\n        with logging_redirect_tqdm(loggers=loggers, tqdm_class=tqdm_class):\n            yield pbar\n    ```\n\n    Parameters\n    ----------\n    tqdm_class  : optional, (default: tqdm.std.tqdm).\n    loggers  : optional, list.\n    **tqdm_kwargs  : passed to `tqdm_class`.\n    \"\"\"\n    tqdm_kwargs = kwargs.copy()\n    loggers = tqdm_kwargs.pop('loggers', None)\n    tqdm_class = tqdm_kwargs.pop('tqdm_class', std_tqdm)\n    with tqdm_class(*args, **tqdm_kwargs) as pbar:\n        with logging_redirect_tqdm(loggers=loggers, tqdm_class=tqdm_class):\n            yield pbar"}, {"id": "tqdm.contrib.slack", "type": "module", "name": "slack", "qualname": "tqdm.contrib.slack", "module": "tqdm.contrib.slack", "file": "tqdm/contrib/slack.py", "line": 1, "end_line": 119, "docstring": "Sends updates to a Slack app.\n\nUsage:\n>>> from tqdm.contrib.slack import tqdm, trange\n>>> for i in trange(10, token='{token}', channel='{channel}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-slack.png)", "code": "\"\"\"\nSends updates to a Slack app.\n\nUsage:\n>>> from tqdm.contrib.slack import tqdm, trange\n>>> for i in trange(10, token='{token}', channel='{channel}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-slack.png)\n\"\"\"\nimport logging\n\ntry:\n    from slack_sdk import WebClient\nexcept ImportError:\n    raise ImportError(\"Please `pip install slack-sdk`\")\n\nfrom ..auto import tqdm as tqdm_auto\nfrom ..utils import envwrap\nfrom .utils_worker import MonoWorker\n\n__author__ = {\"github.com/\": [\"0x2b3bfa0\", \"casperdcl\"]}\n__all__ = ['SlackIO', 'tqdm_slack', 'tsrange', 'tqdm', 'trange']\n\n\nclass SlackIO(MonoWorker):\n    \"\"\"Non-blocking file-like IO using a Slack app.\"\"\"\n    def __init__(self, token, channel):\n        \"\"\"Creates a new message in the given `channel`.\"\"\"\n        super().__init__()\n        self.client = WebClient(token=token)\n        self.text = self.__class__.__name__\n        try:\n            self.message = self.client.chat_postMessage(channel=channel, text=self.text)\n        except Exception as e:\n            tqdm_auto.write(str(e))\n            self.message = None\n\n    def write(self, s):\n        \"\"\"Replaces internal `message`'s text with `s`.\"\"\"\n        if not s:\n            s = \"...\"\n        s = s.replace('\\r', '').strip()\n        if s == self.text:\n            return  # skip duplicate message\n        message = self.message\n        if message is None:\n            return\n        self.text = s\n        try:\n            future = self.submit(self.client.chat_update, channel=message['channel'],\n                                 ts=message['ts'], text='`' + s + '`')\n        except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            return future\n\n\nclass tqdm_slack(tqdm_auto):  # pylint: disable=inconsistent-mro\n    \"\"\"\n    Standard `tqdm.auto.tqdm` but also sends updates to a Slack app.\n    May take a few seconds to create (`__init__`).\n\n    - create a Slack app with the `chat:write` scope & invite it to a\n      channel: <https://api.slack.com/authentication/basics>\n    - copy the bot `{token}` & `{channel}` and paste below\n    >>> from tqdm.contrib.slack import tqdm, trange\n    >>> for i in tqdm(iterable, token='{token}', channel='{channel}'):\n    ...     ...\n    \"\"\"\n    @envwrap(\"tqdm\", \"slack\", is_method=True)\n    def __init__(self, *args, token=None, channel=None, **kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        token  : str, required. Slack token\n            [default: ${TQDM_SLACK_TOKEN}].\n        channel  : int, required. Slack channel\n            [default: ${TQDM_SLACK_CHANNEL}].\n        mininterval  : float, optional.\n          Minimum of [default: 1.5] to avoid rate limit.\n\n        See `tqdm.auto.tqdm.__init__` for other parameters.\n        \"\"\"\n        if not kwargs.get('disable'):\n            kwargs = kwargs.copy()\n            logging.getLogger(\"HTTPClient\").setLevel(logging.WARNING)\n            self.sio = SlackIO(token, channel)\n            kwargs['mininterval'] = max(1.5, kwargs.get('mininterval', 1.5))\n        super().__init__(*args, **kwargs)\n\n    def display(self, **kwargs):  # pylint: disable=arguments-differ\n        super().display(**kwargs)\n        fmt = self.format_dict\n        if fmt.get('bar_format', None):\n            fmt['bar_format'] = fmt['bar_format'].replace(\n                '<bar/>', '`{b : "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 1, "end_line": 152, "docstring": "Sends updates to a Telegram bot.\n\nUsage:\n>>> from tqdm.contrib.telegram import tqdm, trange\n>>> for i in trange(10, token='{token}', chat_id='{chat_id}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-telegram.gif)", "code": "\"\"\"\nSends updates to a Telegram bot.\n\nUsage:\n>>> from tqdm.contrib.telegram import tqdm, trange\n>>> for i in trange(10, token='{token}', chat_id='{chat_id}'):\n...     ...\n\n![screenshot](https://tqdm.github.io/img/screenshot-telegram.gif)\n\"\"\"\nfrom warnings import warn\n\nfrom requests import Session\n\nfrom ..auto import tqdm as tqdm_auto\nfrom ..std import TqdmWarning\nfrom ..utils import envwrap\nfrom .utils_worker import MonoWorker\n\n__author__ = {\"github.com/\": [\"casperdcl\"]}\n__all__ = ['TelegramIO', 'tqdm_telegram', 'ttgrange', 'tqdm', 'trange']\n\n\nclass TelegramIO(MonoWorker):\n    \"\"\"Non-blocking file-like IO using a Telegram Bot.\"\"\"\n    API = 'https://api.telegram.org/bot'\n\n    def __init__(self, token, chat_id):\n        \"\"\"Creates a new message in the given `chat_id`.\"\"\"\n        super().__init__()\n        self.token = token\n        self.chat_id = chat_id\n        self.session = Session()\n        self.text = self.__class__.__name__\n        self.message_id  # pylint: disable=pointless-statement\n\n    @property\n    def message_id(self):\n        if hasattr(self, '_message_id'):\n            return self._message_id  # pylint: disable=access-member-before-definition\n        try:\n            req = self.session.post(\n                f'{self.API}{self.token}/sendMessage',\n                data={'text': f\"`{self.text}`\", 'chat_id': self.chat_id,\n                      'parse_mode': 'MarkdownV2'})\n            res = req.json()\n            req.raise_for_status()\n        except Exception as e:\n            if req.status_code == 429:\n                warn(\"Creation rate limit: try increasing `mininterval`.\",\n                     TqdmWarning, stacklevel=2)\n            else:\n                tqdm_auto.write(str(e))\n        else:\n            self._message_id = res['result']['message_id']\n            return self._message_id\n\n    def write(self, s):\n        \"\"\"Replaces internal `message_id`'s text with `s`.\"\"\"\n        if not s:\n            s = \"...\"\n        s = s.replace('\\r', '').strip()\n        if s == self.text:\n            return  # avoid duplicate message Bot error\n        message_id = self.message_id\n        if message_id is None:\n            return\n        self.text = s\n        try:\n            future = self.submit(\n                self.session.post, f'{self.API}{self.token}/editMessageText',\n                data={'text': f\"`{s}`\", 'chat_id': self.chat_id,\n                      'message_id': message_id, 'parse_mode': 'MarkdownV2'})\n        except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            return future\n\n    def delete(self):\n        \"\"\"Deletes internal `message_id`.\"\"\"\n        try:\n            future = self.submit(\n                self.session.post, '{self.API}{self.token}/deleteMessage',\n                data={'chat_id': self.chat_id, 'message_id': self.message_id})\n        except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            return future\n\n\nclass tqdm_telegram(tqdm_auto):  # pylint: disable=inconsistent-mro\n    \"\"\"\n    Standard `tqdm.auto.tqdm` but also sends updates to a Telegram Bot.\n    May take a few seconds to create (`__init__`).\n\n    - create a bot <https://core.telegram.org/bots#6-botfather>\n    - copy its `{token}`\n    - add the bot to a chat and send it a message such as `/start`\n    - go to <https://api.telegram.org/bot`{token}`/getUpdates> to find out\n      the `{chat_id}`\n    - paste the `{token}` & `{chat_id}` below\n\n    >>> from tqdm.contrib.telegram import tqdm, trange\n    >>> for i in tqdm(iterable, token='{token}', chat_id='{chat_id}'):\n    ...     ...\n    \"\"\"\n    @envwrap(\"tqdm\", \"telegram\", is_method=True)\n    def __init__(self, *args, token=None, chat_id=None, **kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        token  : str, required. Telegram token\n            [default: ${TQDM_TELEGRAM_TOKEN}].\n        chat_id  : str, required. Telegram chat ID\n            [default: ${TQDM_TELEGRAM_CHAT_ID}].\n\n        See `tqdm.auto.tqdm.__init__` for other parameters.\n        \"\"\"\n        if not kwargs.get('disable'):\n            kwargs = kwargs.copy()\n            self.tgio = TelegramIO(token, chat_id)\n        super().__init__(*args, **kwargs)\n\n    def display(self, **kwargs):  # pylint: disable=arguments-differ\n        super().display(**kwargs)\n        fmt = self.format_dict\n        if fmt.get('bar_format', None):\n            fmt['bar_format'] = fmt['bar_format'].replace(\n                '<bar/>', '{bar:10u}').replace('{bar}', '{bar:10u}')\n        self.tgio.write(self.format_meter(**fmt))\n\n    def clear(self, *args, **kwargs):\n        super().clear(*args, **kwargs)\n        if not self.disable:\n            self.tgio.write(\"\")\n\n    def close(self):\n        if self.disable:\n            return\n        super().close()\n        if not (self.leave or (self.leave is None and self.pos == 0)):\n            self.tgio.delete()\n\n\ndef ttgrange(*args, **kwargs):\n    \"\"\"Shortcut for `tqdm.contrib.telegram.tqdm(range(*args), **kwargs)`.\"\"\"\n    return tqdm_telegram(range(*args), **kwargs)\n\n\n# Aliases\ntqdm = tqdm_telegram\ntrange = ttgrange\n", "external_imports": ["requests", "warnings"]}, {"id": "tqdm.contrib.telegram:TelegramIO", "type": "class", "name": "TelegramIO", "qualname": "TelegramIO", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 24, "end_line": 88, "docstring": "Non-blocking file-like IO using a Telegram Bot.", "code": "class Telegra me": "tqdm_telegram", "qualname": "tqdm_telegram", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 91, "end_line": 142, "docstring": "Standard `tqdm.auto.tqdm` but also sends updates to a Telegram Bot.\nMay take a few seconds to create (`__init__`).\n\n- create a bot <https://core.telegram.org/bots#6-botfather>\n- copy its `{token}`\n- add the bot to a chat and send it a message such as `/start`\n- go to <https://api.telegram.org/bot`{token}`/getUpdates> to find out\n  the `{chat_id}`\n- paste the `{token}` & `{chat_id}` below\n\n>>> from tqdm.contrib.telegram import tqdm, trange\n>>> for i in tqdm(iterable, token='{token}', chat_id='{chat_id}'):\n...     ...", "code": "class tqdm_telegram(tqdm_auto):  # pylint: disable=inconsistent-mro\n    \"\"\"\n    Standard `tqdm.auto.tqdm` but also sends updates to a Telegram Bot.\n    May take a few seconds to create (`__init__`).\n\n    - create a bot <https://core.telegram.org/bots#6-botfather>\n    - copy its `{token}`\n    - add the bot to a chat and send it a message such as `/start`\n    - go to <https://api.telegram.org/bot`{token}`/getUpdates> to find out\n      the `{chat_id}`\n    - paste the `{token}` & `{chat_id}` below\n\n    >>> from tqdm.contrib.telegram import tqdm, trange\n    >>> for i in tqdm(iterable, token='{token}', chat_id='{chat_id}'):\n    ...     ...\n    \"\"\"\n    @envwrap(\"tqdm\", \"telegram\", is_method=True)\n    def __init__(self, *args, token=None, chat_id=None, **kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        token  : str, required. Telegram token\n            [default: ${TQDM_TELEGRAM_TOKEN}].\n        chat_id  : str, required. Telegram chat ID\n            [default: ${TQDM_TELEGRAM_CHAT_ID}].\n\n        See `tqdm.auto.tqdm.__init__` for other parameters.\n        \"\"\"\n        if not kwargs.get('disable'):\n            kwargs = kwargs.copy()\n            self.tgio = TelegramIO(token, chat_id)\n        super().__init__(*args, **kwargs)\n\n    def display(self, **kwargs):  # pylint: disable=arguments-differ\n        super().display(**kwargs)\n        fmt = self.format_dict\n        if fmt.get('bar_format', None):\n            fmt['bar_format'] = fmt['bar_format'].replace(\n                '<bar/>', '{bar:10u}').replace('{bar}', '{bar:10u}')\n        self.tgio.write(self.format_meter(**fmt))\n\n    def clear(self, *args, **kwargs):\n        super().clear(*args, **kwargs)\n        if not self.disable:\n            self.tgio.write(\"\")\n\n    def close(self):\n        if self.disable:\n            return\n        super().close()\n        if not (self.leave or (self.leave is None and self.pos == 0)):\n            self.tgio.delete()"}, {"id": "tqdm.contrib.telegram:tqdm_telegram.__init__", "type": "method", "name": "__init__", "qualname": "tqdm_telegram.__init__", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 108, "end_line": 122, "docstring": "Parameters\n----------\ntoken  : str, required. Telegram token\n    [default: ${TQDM_TELEGRAM_TOKEN}].\nchat_id  : str, required. Telegram chat ID\n    [default: ${TQDM_TELEGRAM_CHAT_ID}].\n\nSee `tqdm.auto.tqdm.__init__` for other parameters.", "code": "    @envwrap(\"tqdm\", \"telegram\", is_method=True)\n    def __init__(self, *args, token=None, chat_id=None, **kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        token  : str, required. Telegram token\n            [default: ${TQDM_TELEGRAM_TOKEN}].\n        chat_id  : str, required. Telegram chat ID\n            [default: ${TQDM_TELEGRAM_CHAT_ID}].\n\n        See `tqdm.auto.tqdm.__init__` for other parameters.\n        \"\"\"\n        if not kwargs.get('disable'):\n            kwargs = kwargs.copy()\n            self.tgio = TelegramIO(token, chat_id)\n        super().__init__(*args, **kwargs)"}, {"id": "tqdm.contrib.telegram:tqdm_telegram.display", "type": "method", "name": "display", "qualname": "tqdm_telegram.display", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 124, "end_line": 130, "docstring": null, "code": "    def display(self, **kwargs):  # pylint: disable=arguments-differ\n        super().display(**kwargs)\n        fmt = self.format_dict\n        if fmt.get('bar_format', None):\n            fmt['bar_format'] = fmt['bar_format'].replace(\n                '<bar/>', '{bar:10u}').replace('{bar}', '{bar:10u}')\n        self.tgio.write(self.format_meter(**fmt))"}, {"id": "tqdm.contrib.telegram:tqdm_telegram.clear", "type": "method", "name": "clear", "qualname": "tqdm_telegram.clear", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 132, "end_line": 135, "docstring": null, "code": "    def clear(self, *args, **kwargs):\n        super().clear(*args, **kwargs)\n        if not self.disable:\n            self.tgio.write(\"\")"}, {"id": "tqdm.contrib.telegram:tqdm_telegram.close", "type": "method", "name": "close", "qualname": "tqdm_telegram.close", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 137, "end_line": 142, "docstring": null, "code": "    def close(self):\n        if self.disable:\n            return\n        super().close()\n        if not (self.leave or (self.leave is None and self.pos == 0)):\n            self.tgio.delete()"}, {"id": "tqdm.contrib.telegram:ttgrange", "type": "function", "name": "ttgrange", "qualname": "ttgrange", "module": "tqdm.contrib.telegram", "file": "tqdm/contrib/telegram.py", "line": 145, "end_line": 147, "docstring": "Shortcut for `tqdm.contrib.telegram.tqdm(range(*args), **kwargs)`.", "code": "def ttgrange(*args, **kwargs):\n    \"\"\"Shortcut for `tqdm.contrib.telegram.tqdm(range(*args), **kwargs)`.\"\"\"\n    return tqdm_telegram(range(*args), **kwargs)"}, {"id": "tqdm.contrib.utils_worker", "type": "module", "name": "utils_worker", "qualname": "tqdm.contrib.utils_worker", "module": "tqdm.contrib.utils_worker", "file": "tqdm/contrib/utils_worker.py", "line": 1, "end_line": 38, "docstring": "IO/concurrency helpers for `tqdm.contrib`.", "code": "\"\"\"\nIO/concurrency helpers for `tqdm.contrib`.\n\"\"\"\nfrom collections import deque\nfrom concurrent.futures import ThreadPoolExecutor\n\nfrom ..auto import tqdm as tqdm_auto\n\n__author__ = {\"github.com/\": [\"casperdcl\"]}\n__all__ = ['MonoWorker']\n\n\nclass MonoWorker:\n    \"\"\"\n    Supports one running task and one waiting task.\n    The waiting task is the most recent submitted (others are discarded).\n    \"\"\"\n    def __init__(self):\n        self.pool = ThreadPoolExecutor(max_workers=1)\n        self.futures = deque([], 2)\n\n    def submit(self, func, *args, **kwargs):\n        \"\"\"`func(*args, **kwargs)` may replace currently waiting task.\"\"\"\n        futures = self.futures\n        if len(futures) == futures.maxlen:\n            running = futures.popleft()\n            if not running.done():\n                if len(futures):  # clear waiting\n                    waiting = futures.pop()\n                    waiting.cancel()\n                futures.appendleft(running)  # re-insert running\n        try:\n            waiting = self.pool.submit(func, *args, **kwargs)\n        except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            futures.append(waiting)\n            return waiting\n", "external_imports": ["collections", "concurrent"]}, {"id": "tqdm.contrib.utils_worker:MonoWorker", "type": "class", "name": "MonoWorker", "qualname": "MonoWorker", "module": "tqdm.contrib.utils_worker", "file": "tqdm/contrib/utils_worker.py", "line": 13, "end_line": 38, "docstring": "Supports one running task and one waiting task.\nThe waiting task is the most recent submitted (others are discarded).", "code": "class MonoWorker:\n    \"\"\"\n    Supports one running task and one waiting task.\n    The waiting task is the most recent submitted (others are discarded).\n    \"\"\"\n    def __init__(self):\n        self.pool = ThreadPoolExecutor(max_workers=1)\n      except Exception as e:\n            tqdm_auto.write(str(e))\n        else:\n            futures.append(waiting)\n            return waiting"}, {"id": "tqdm.dask", "type": "module", "name": "dask", "qualname": "tqdm.dask", "module": "tqdm.dask", "file": "tqdm/dask.py", "line": 1, "end_line": 44, "docstring": null, "code": "from functools import partial\n\nfrom dask.callbacks import Callback\n\nfrom .auto import tqdm as tqdm_auto\n\n__author__ = {\"github.com/\": [\"casperdcl\"]}\n__all__ = ['TqdmCallback']\n\n\nclass TqdmCallback(Callback):\n    \"\"\"Dask callback for task progress.\"\"\"\n    def __init__(self, start=None, pretask=None, tqdm_class=tqdm_auto,\n                 **tqdm_kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        tqdm_class  : optional\n            `tqdm` class to use for bars [default: `tqdm.auto.tqdm`].\n        tqdm_kwargs  : optional\n            Any other arguments used for all bars.\n        \"\"\"\n        super().__init__(start=start, pretask=pretask)\n        if tqdm_kwargs:\n            tqdm_class = partial(tqdm_class, **tqdm_kwargs)\n        self.tqdm_class = tqdm_class\n\n    def _start_state(self, _, state):\n        self.pbar = self.tqdm_class(total=sum(\n            len(state[k]) for k in ['ready', 'waiting', 'running', 'finished']))\n\n    def _posttask(self, *_, **__):\n        self.pbar.update()\n\n    def _finish(self, *_, **__):\n        self.pbar.close()\n\n    def display(self):\n        \"\"\"Displays in the current cell in Notebooks.\"\"\"\n        container = getattr(self.bar, 'container', None)\n        if container is None:\n            return\n        from .notebook import display\n        display(container)\n", "external_imports": ["dask", "functools"]}, {"id": "tqdm.dask:TqdmCallback", "type": "class", "name": "TqdmCallback", "qualname": "TqdmCallback", "module": "tqdm.dask", "file": "tqdm/dask.py", "line": 11, "end_line": 44, "docstring": "Dask callback for task progress.", "code": "clas progress bar decorator for iterators.\n\nUsage:\n>>> from tqdm.gui import trange, tqdm\n>>> for i in trange(10):\n...     ...\n\"\"\"\n# future division is important to divide integers and get as\n# a result precise floating numbers (instead of truncated int)\nimport re\nfrom warnings import warn\n\n# to inherit from the tqdm class\nfrom .std import TqdmExperimentalWarning\nfrom .std import tqdm as std_tqdm\n\n# import compatibility functions and utilities\n\n__author__ = {\"github.com/\": [\"casperdcl\", \"lrq3000\"]}\n__all__ = ['tqdm_gui', 'tgrange', 'tqdm', 'trange']\n\n\nclass tqdm_gui(std_tqdm):  # pragma: no cover\n    \"\"\"Experimental Matplotlib GUI version of tqdm!\"\"\"\n    # TODO: @classmethod: write() on GUI?\n    def __init__(self, *args, **kwargs):\n        from collections import deque\n\n        import matplotlib as mpl\n        import matplotlib.pyplot as plt\n        kwargs = kwargs.copy()\n        kwargs['gui'] = True\n        colour = kwargs.pop('colour', 'g')\n        super().__init__(*args, **kwargs)\n\n        if self.disable:\n            return\n\n        warn(\"GUI is experimental/alpha\", TqdmExperimentalWarning, stacklevel=2)\n        self.mpl = mpl\n        self.plt = plt\n\n        # Remember if external environment uses toolbars\n        self.toolbar = self.mpl.rcParams['toolbar']\n        self.mpl.rcParams['toolbar'] = 'None'\n\n        self.mininterval = max(self.mininterval, 0.5)\n        self.fig, ax = plt.subplots(figsize=(9, 2.2))\n        # self.fig.subplots_adjust(bottom=0.2)\n        total = self.__len__()  # avoids TypeError on None #971\n        if total is not None:\n            self.xdata = []\n            self.ydata = []\n            self.zdata = []\n        else:\n            self.xdata = deque([])\n            self.ydata = deque([])\n            self.zdata = deque([])\n        self.line1, = ax.plot(self.xdata, self.ydata, color='b')\n        self.line2, = ax.plot(self.xdata, self.zdata, color='k')\n        ax.set_ylim(0, 0.001)\n        if total is not None:\n            ax.set_xlim(0, 100)\n            ax.set_xlabel(\"percent\")\n            self.fig.legend((self.line1, self.line2), (\"cur\", \"est\"),\n                            loc='center right')\n            # progress bar\n            self.hspan = plt.axhspan(0, 0.001, xmin=0, xmax=0, color=colour)\n        else:\n            # ax.set_xlim(-60, 0)\n            ax.set_xlim(0, 60)\n            ax.invert_xaxis()\n            ax.set_xlabel(\"seconds\")\n            ax.legend((\"cur\", \"est\"), loc='lower left')\n        ax.grid()\n        # ax.set_xlabel('seconds')\n        ax.set_ylabel((self.unit if self.unit else \"it\") + \"/s\")\n        if self.unit_scale:\n            plt.ticklabel_format(style='sci', axis='y', scilimits=(0, 0))\n            ax.yaxis.get_offset_text().set_x(-0.15)\n\n        # Remember if external environment is interactive\n        self.wasion = plt.isinteractive()\n        plt.ion()\n        self.ax = ax\n\n    def close(self):\n        if self.disable:\n            return\n\n        self.disable = True\n\n        with self.get_lock():\n            self._instances.remove(self)\n\n        # Restore toolbars\n        self.mpl.rcParams['toolbar'] = self.toolbar\n        # Return to non-interactive mode\n        if not self.wasion:\n            self.plt.ioff()\n        if self.leave:\n            self.display()\n        else:\n            self.plt.close(self.fig)\n\n    def clear(self, *_, **__):\n        pass\n\n    def display(self, *_, **__):\n        n = self.n\n        cur_t = self._time()\n        elapsed = cur_t - self.start_t\n        delta_it = n - self.last_print_n\n        delta_t = cur_t - self.last_print_t\n\n        # Inline due to multiple calls\n        total = self.total\n        xdata = self.xdata\n        ydata = self.ydata\n        zdata = self.zdata\n        ax = self.ax\n        line1 = self.line1\n        line2 = self.line2\n        hspan = getattr(self, 'hspan', None)\n        # instantaneous rate\n        y = delta_it / delta_t\n        # overall rate\n        z = n / elapsed\n        # update line data\n        xdata.append(n * 100.0 / total if total else cur_t)\n        ydata.append(y)\n        zdata.append(z)\n\n        # Discard old values\n        # xmin, xmax = ax.get_xlim()\n        # if (not total) and elapsed > xmin * 1.1:\n        if (not total) and elapsed > 66:\n            xdata.popleft()\n            ydata.popleft()\n            zdata.popleft()\n\n        ymin, ymax = ax.get_ylim()\n        if y > ymax or z > ymax:\n            ymax = 1.1 * y\n            ax.set_ylim(ymin, ymax)\n            ax.figure.canvas.draw()\n\n        if total:\n            line1.set_data(xdata, ydata)\n            line2.set_data(xdata, zdata)\n            if hspan:\n                hspan.set_xy((0, ymin))\n                hspan.set_height(ymax - ymin)\n                hspan.set_width(n / total)\n        else:\n            t_ago = [cur_t - i for i in xdata]\n            line1.set_data(t_ago, ydata)\n            line2.set_data(t_ago, zdata)\n\n        d = self.format_dict\n        # remove {bar}\n        d['bar_format'] = (d['bar_format'] or \"{l_bar}<bar/>{r_bar}\").replace(\n            \"{bar}\", \"<bar/>\")\n        msg = self.format_meter(**d)\n        if '<bar/>' in msg:\n            msg = \"\".join(re.split(r'\\|?<bar/>\\|?', msg, maxsplit=1))\n        ax.set_title(msg, fontname=\"DejaVu Sans Mono\", fontsize=11)\n        self.plt.pause(1e-9)\n\n\ndef tgrange(*args, **kwargs):\n    \"\"\"Shortcut for `tqdm.gui.tqdm(range(*args), **kwargs)`.\"\"\"\n    return tqdm_gui(range(*args), **kwargs)\n\n\n# Aliases\ntqdm = tqdm_gui\ntrange = tgrange\n", "external_imports": ["collections", "matplotlib", "re", "warnings"]}, {"id": "tqdm.gui:tqdm_gui", "type": "class", "name": "tqdm_gui", "qualname": "tqdm_gui", "module": "tqdm.gui", "file": "tqdm/gui.py", "line": 24, "end_line": 169, "docstring": "Experimental Matplotlib GUI version of tqdm!", "code": "cla 1,\n                 tqdm_class=tqdm_auto, **tqdm_kwargs):\n        \"\"\"\n        Parameters\n        ----------\n        epochs  : int, optional\n        data_size  : int, optional\n            Number of training pairs.\n        batch_size  : int, optional\n            Number of training pairs per batch.\n        verbose  : int\n            0: epoch, 1: batch (transient), 2: batch. [default: 1].\n            Will be set to `0` unless both `data_size` and `batch_size`\n            are given.\n        tqdm_class  : optional\n            `tqdm` class to use for bars [default: `tqdm.auto.tqdm`].\n        tqdm_kwargs  : optional\n            Any other arguments used for all bars.\n        \"\"\"\n        if tqdm_kwargs:\n            tqdm_class = partial(tqdm_class, **tqdm_kwargs)\n        self.tqdm_class = tqdm_class\n        self.epoch_bar = tqdm_class(total=epochs, unit='epoch')\n        self.on_epoch_end = self.bar2callback(self.epoch_bar)\n        if data_size and batch_size:\n            self.batches = batches = (data_size + batch_size - 1) // batch_size\n        else:\n            self.batches = batches = None\n        self.verbose = verbose\n        if verbose == 1:\n            self.batch_bar = tqdm_class(total=batches, unit='batch', leave=False)\n            self.on_batch_end = self.bar2callback(\n                self.batch_bar, pop=['batch', 'size'],\n                delta=lambda logs: logs.get('size', 1))\n\n    def on_train_begin(self, *_, **__):\n        params = self.params.get\n        auto_total = params('epochs', params('nb_epoch', None))\n        if auto_total is not None and auto_total != self.epoch_bar.total:\n            self.epoch_bar.reset(total=auto_total)\n\n    def on_epoch_begin(self, epoch, *_, **__):\n        if self.epoch_bar.n < epoch:\n            ebar = self.epoch_bar\n            ebar.n = ebar.last_print_n = ebar.initial = epoch\n        if self.verbose:\n            params = self.params.get\n            total = params('samples', params(\n                'nb_sample', params('steps', None))) or self.batches\n            if self.verbose == 2:\n                if hasattr(self, 'batch_bar'):\n                    self.batch_bar.close()\n                self.batch_bar = self.tqdm_class(\n                    total=total, unit='batch', leave=True,\n                    unit_scale=1 / (params('batch_size', 1) or 1))\n                self.on_batch_end = self.bar2callback(\n                    self.batch_bar, pop=['batch', 'size'],\n                    delta=lambda logs: logs.get('size', 1))\n            elif self.verbose == 1:\n                self.batch_bar.unit_scale = 1 / (params('batch_size', 1) or 1)\n                self.batch_bar.reset(total=total)\n            else:\n                raise KeyError('Unknown verbosity')\n\n    def on_train_end(self, *_, **__):\n        if hasattr(self, 'batch_bar'):\n            self.batch_bar.close()\n        self.epoch_bar.close()\n\n    def display(self):\n        \"\"\"Displays in the current cell in Notebooks.\"\"\"\n        container = getattr(self.epoch_bar, 'container', None)\n        if container is None:\n            return\n        from .notebook import display\n        display(container)\n        batch_bar = getattr(self, 'batch_bar', None)\n        if batch_bar is not None:\n            display(batch_bar.container)\n\n    @staticmethod\n    def _implements_train_batch_hooks():\n        return True\n\n    @staticmethod\n    def _implements_test_batch_hooks():\n        return True\n\n    @staticmethod\n    def _implements_predict_batch_hooks():\n        return True\n", "external_imports": ["copy", "functools", "keras", "tensorflow"]}, {"id": "tqdm.keras:TqdmCallback", "type": "class", "name": "TqdmCallback", "qualname": "TqdmCallback", "module": "tqdm.keras", "file": "tqdm/keras.py", "line": 17, "end_line": 123, "docstring": "Keras callback for epoch and batch progress.", "code": "class TqdmCallback(keras.callbacks.Callback):\n    \"\"\"Keras callback for tilities\n    IPY = 0\n    try:  # IPython 4.x\n        import ipywidgets  # noqa: F401, pylint: disable=unused-import\n        IPY = 4\n    except ImportError:  # IPython 3.x / 2.x\n        IPY = 32\n        import warnings\n        with warnings.catch_warnings():\n            warnings.filterwarnings(\n                'ignore', message=\".*The `IPython.html` package has been deprecated.*\")\n            try:\n                import IPython.html.widgets\n            except ImportError:\n                pass\n            else:\n                ipywidgets = IPython.html.widgets\n\n    try:  # IPython 4.x / 3.x\n        if IPY == 32:\n            from IPython.html.widgets import HTML\n            from IPython.html.widgets import FloatProgress as IProgress\n            from IPython.html.widgets import HBox\n            IPY = 3\n        else:\n            from ipywidgets import HTML\n            from ipywidgets import FloatProgress as IProgress\n            from ipywidgets import HBox\n    except ImportError:\n        try:  # IPython 2.x\n            from IPython.html.widgets import HTML\n            from IPython.html.widgets import ContainerWidget as HBox\n            from IPython.html.widgets import FloatProgressWidget as IProgress\n            IPY = 2\n        except ImportError:\n            IPY = 0\n            IProgress = None\n            HBox = object\n\n    try:\n        from IPython.display import display  # , clear_output\n    except ImportError:\n        pass\n\n__author__ = {\"github.com/\": [\"lrq3000\", \"casperdcl\", \"alexanderkuk\"]}\n__all__ = ['tqdm_notebook', 'tnrange', 'tqdm', 'trange']\nWARN_NOIPYW = (\"IProgress not found. Please update jupyter and ipywidgets.\"\n               \" See https://ipywidgets.readthedocs.io/en/stable\"\n               \"/user_install.html\")\n\n\nclass TqdmHBox(HBox):\n    \"\"\"`ipywidgets.HBox` with a pretty representation\"\"\"\n    def _json_(self, pretty=None):\n        pbar = getattr(self, 'pbar', None)\n        i
