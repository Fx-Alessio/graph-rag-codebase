            'n': self.n, 'total': self.total,\n            'elapsed': self._time() - self.start_t if hasattr(self, 'start_t') else 0,\n            'ncols': self.ncols, 'nrows': self.nrows, 'prefix': self.desc,\n            'ascii': self.ascii, 'unit': self.unit, 'unit_scale': self.unit_scale,\n            'rate': self._ema_dn() / self._ema_dt() if self._ema_dt() else None,\n            'bar_format': self.bar_format, 'postfix': self.postfix,\n            'unit_divisor': self.unit_divisor, 'initial': self.initial,\n            'colour': self.colour}\n\n    def display(self, msg=None, pos=None):\n        \"\"\"\n        Use `self.sp` to display `msg` in the specified `pos`.\n\n        Consider overloading this function when inheriting to use e.g.:\n        `self.some_frontend(**self.format_dict)` instead of `self.sp`.\n\n        Parameters\n        ----------\n        msg  : str, optional. What to display (default: `repr(self)`).\n        pos  : int, optional. Position to `moveto`\n          (default: `abs(self.pos)`).\n        \"\"\"\n        if pos is None:\n            pos = abs(self.pos)\n\n        nrows = self.nrows or 20\n        if pos >= nrows - 1:\n            if pos >= nrows:\n                return False\n            if msg or msg is None:  # override at `nrows - 1`\n                msg = \" ... (more hidden) ...\"\n\n        if not hasattr(self, \"sp\"):\n            raise TqdmDeprecationWarning(\n                \"Please use `tqdm.gui.tqdm(...)`\"\n                \" instead of `tqdm(..., gui=True)`\\n\",\n                fp_write=getattr(self.fp, 'write', sys.stderr.write))\n\n        if pos:\n            self.moveto(pos)\n        self.sp(self.__str__() if msg is None else msg)\n        if pos:\n            self.moveto(-pos)\n        return True\n\n    @classmethod\n    @contextmanager\n    def wrapattr(cls, stream, method, total=None, bytes=True,  # pylint: disable=redefined-builtin\n                 **tqdm_kwargs):\n        \"\"\"\n        stream  : file-like object.\n        method  : str, \"read\" or \"write\". The result of `read()` and\n            the first argument of `write()` should have a `len()`.\n\n        >>> with tqdm.wrapattr(file_obj, \"read\", total=file_obj.size) as fobj:\n        ...     while True:\n        ...         chunk = fobj.read(chunk_size)\n        ...         if not chunk:\n        ...             break\n        \"\"\"\n        with cls(total=total, **tqdm_kwargs) as t:\n            if bytes:\n                t.unit = \"B\"\n                t.unit_scale = True\n                t.unit_divisor = 1024\n            yield CallbackIOWrapper(t.update, stream, method)"}, {"id": "tqdm.std:tqdm.format_sizeof", "type": "method", "name": "format_sizeof", "qualname": "tqdm.format_sizeof", "module": "tqdm.std", "file": "tqdm/std.py", "line": 368, "end_line": 395, "docstring": "Formats a number (greater than unity) with SI Order of Magnitude\nprefixes.\n\nParameters\n----------\nnum  : float\n    Number ( >= 1) to format.\nsuffix  : str, optional\n    Post-postfix [default: ''].\ndivisor  : float, optional\n    Divisor between prefixes [default: 1000].\n\nReturns\n-------\nout  : str\n    Number with Order of Magnitude SI unit postfix.", "code": "    @staticmethod\n    def format_sizeof(num, suffix='', divisor=1000):\n        \"\"\"\n        Formats a number (greater than unity) with SI Order of Magnitude\n        prefixes.\n\n        Parameters\n        ----------\n        num  : float\n            Number ( >= 1) to format.\n        suffix  : str, optional\n            Post-postfix [default: ''].\n        divisor  : float, optional\n            Divisor between prefixes [default: 1000].\n\n        Returns\n        -------\n        out  : str\n            Number with Order of Magnitude SI unit postfix.\n        \"\"\"\n        for unit in ['', 'k', 'M', 'G', 'T', 'P', 'E', 'Z']:\n            if abs(num) < 999.5:\n                if abs(num) < 99.95:\n                    if abs(num) < 9.995:\n                        return f'{num:1.2f}{unit}{suffix}'\n                    return f'{num:2.1f}{unit}{suffix}'\n                return f'{num:3.0f}{unit}{suffix}'\n            num /= divisor\n        return f'{num:3.1f}Y{suffix}'"}, {"id": "tqdm.std:tqdm.format_interval", "type": "method", "name": "format_interval", "qualname": "tqdm.format_interval", "module": "tqdm.std", "file": "tqdm/std.py", "line": 398, "end_line": 415, "docstring": "Formats a number of seconds as a clock time, [H:]MM:SS\n\nParameters\n----------\nt  : int\n    Number of seconds.\n\nReturns\n-------\nout  : str\n    [H:]MM:SS", "code": "    @staticmethod\n    def format_interval(t):\n        \"\"\"\n        Formats a number of seconds as a clock time, [H:]MM:SS\n\n        Parameters\n        ----------\n        t  : int\n            Number of seconds.\n\n        Returns\n        -------\n        out  : str\n            [H:]MM:SS\n        \"\"\"\n        sign = '-' if t < 0 else ''\n        mins, s = divmod(abs(int(t)), 60)\n        h, m = divmod(mins, 60)\n        return f'{sign}{h:d}:{m:02d}:{s:02d}' if h else f'{sign}{m:02d}:{s:02d}'"}, {"id": "tqdm.std:tqdm.format_num", "type": "method", "name": "format_num", "qualname": "tqdm.format_num", "module": "tqdm.std", "file": "tqdm/std.py", "line": 418, "end_line": 434, "docstring": "Intelligent scientific notation (.3g).\n\nParameters\n----------\nn  : int or float or Numeric\n    A Number.\n\nReturns\n-------\nout  : str\n    Formatted number.", "code": "    @staticmethod\n    def format_num(n):\n        \"\"\"\n        Intelligent scientific notation (.3g).\n\n        Parameters\n        ----------\n        n  : int or float or Numeric\n            A Number.\n\n        Returns\n        -------\n        out  : str\n            Formatted number.\n        \"\"\"\n        f = f'{n:.3g}'.replace('e+0', 'e+').replace('e-0', 'e-')\n        n = str(n)\n        return f if len(f) < len(n) else n"}, {"id": "tqdm.std:tqdm.status_printer", "type": "method", "name": "status_printer", "qualname": "tqdm.status_printer", "module": "tqdm.std", "file": "tqdm/std.py", "line": 437, "end_line": 460, "docstring": "Manage the printing and in-place updating of a line of characters.\nNote that if the string is longer than a line, then in-place\nupdating may not work (it will print a new line at each refresh).", "code": "    @staticmethod\n    def status_printer(file):\n        \"\"\"\n        Manage the printing and in-place updating of a line of characters.\n        Note that if the string is longer than a line, then in-place\n        updating may not work (it will print a new line at each refresh).\n        \"\"\"\n        fp = file\n        fp_flush = getattr(fp, 'flush', lambda: None)  # pragma: no cover\n        if fp in (sys.stderr, sys.stdout):\n            getattr(sys.stderr, 'flush', lambda: None)()\n            getattr(sys.stdout, 'flush', lambda: None)()\n\n        def fp_write(s):\n            fp.write(str(s))\n            fp_flush()\n\n        last_len = [0]\n\n        def print_status(s):\n            len_s = disp_len(s)\n            fp_write('\\r' + s + (' ' * max(last_len[0] - len_s, 0)))\n            last_len[0] = len_s\n\n        return print_status"}, {"id": "tqdm.std:tqdm.format_meter", "type": "method", "name": "format_meter", "qualname": "tqdm.format_meter", "module": "tqdm.std", "file": "tqdm/std.py", "line": 463, "end_line": 662, "docstring": "Return a string-based progress bar given some parameters\n\nParameters\n----------\nn  : int or float\n    Number of finished iterations.\ntotal  : int or float\n    The expected total number of iterations. If meaningless (None),\n    only basic progress statistics are displayed (no ETA).\nelapsed  : float\n    Number of seconds passed since start.\nncols  : int, optional\n    The width of the entire output message. If specified,\n    dynamically resizes `{bar}` to stay within this bound\n    [default: None]. If `0`, will not print any bar (only stats).\n    The fallback is `{bar:10}`.\nprefix  : str, optional\n    Prefix message (included in total width) [default: ''].\n    Use as {desc} in bar_format string.\nascii  : bool, optional or str, optional\n    If not set, use unicode (smooth blocks) to fill the meter\n    [default: False]. The fallback is to use ASCII characters\n    \" 123456789#\".\nunit  : str, optional\n    The iteration unit [default: 'it'].\nunit_scale  : bool or int or float, optional\n    If 1 or True, the number of iterations will be printed with an\n    appropriate SI metric prefix (k = 10^3, M = 10^6, etc.)\n    [default: False]. If any other non-zero number, will scale\n    `total` and `n`.\nrate  : float, optional\n    Manual override for iteration rate.\n    If [default: None], uses n/elapsed.\nbar_format  : str, optional\n    Specify a custom bar string formatting. May impact performance.\n    [default: '{l_bar}{bar}{r_bar}'], where\n    l_bar='{desc}: {percentage:3.0f}%|' and\n    r_bar='| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, '\n      '{rate_fmt}{postfix}]'\n    Possible vars: l_bar, bar, r_bar, n, n_fmt, total, total_fmt,\n      percentage, elapsed, elapsed_s, ncols, nrows, desc, unit,\n      rate, rate_fmt, rate_noinv, rate_noinv_fmt,\n      rate_inv, rate_inv_fmt, postfix, unit_divisor,\n      remaining, remaining_s, eta.\n    Note that a trailing \": \" is automatically removed after {desc}\n    if the latter is empty.\npostfix  : *, optional\n    Similar to `prefix`, but placed at the end\n    (e.g. for additional stats).\n    Note: postfix is usually a string (not a dict) for this method,\n    and will if possible be set to postfix = ', ' + postfix.\n    However other types are supported (#382).\nunit_divisor  : float, optional\n    [default: 1000], ignored unless `unit_scale` is True.\ninitial  : int or float, optional\n    The initial counter value [default: 0].\ncolour  : str, optional\n    Bar colour (e.g. 'green', '#00ff00').\n\nReturns\n-------\nout  : Formatted meter and stats, ready to display.", "code": "    @staticmethod\n    def format_meter(n, total, elapsed, ncols=None, prefix='',\n                     ascii=False,  # pylint: disable=redefined-builtin\n                     unit='it', unit_scale=False, rate=None, bar_format=None, postfix=None,\n                     unit_divisor=1000, initial=0, colour=None, **extra_kwargs):\n        \"\"\"\n        Return a string-based progress bar given some parameters\n\n        Parameters\n        ----------\n        n  : int or float\n            Number of finished iterations.\n        total  : int or float\n            The expected total number of iterations. If meaningless (None),\n            only basic progress statistics are displayed (no ETA).\n        elapsed  : float\n            Number of seconds passed since start.\n        ncols  : int, optional\n            The width of the entire output message. If specified,\n            dynamically resizes `{bar}` to stay within this bound\n            [default: None]. If `0`, will not print any bar (only stats).\n            The fallback is `{bar:10}`.\n        prefix  : str, optional\n            Prefix message (included in total width) [default: ''].\n            Use as {desc} in bar_format string.\n        ascii  : bool, optional or str, optional\n            If not set, use unicode (smooth blocks) to fill the meter\n            [default: False]. The fallback is to use ASCII characters\n            \" 123456789#\".\n        unit  : str, optional\n            The iteration unit [default: 'it'].\n        unit_scale  : bool or int or float, optional\n            If 1 or True, the number of iterations will be printed with an\n            appropriate SI metric prefix (k = 10^3, M = 10^6, etc.)\n            [default: False]. If any other non-zero number, will scale\n            `total` and `n`.\n        rate  : float, optional\n            Manual override for iteration rate.\n            If [default: None], uses n/elapsed.\n        bar_format  : str, optional\n            Specify a custom bar string formatting. May impact performance.\n            [default: '{l_bar}{bar}{r_bar}'], where\n            l_bar='{desc}: {percentage:3.0f}%|' and\n            r_bar='| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, '\n              '{rate_fmt}{postfix}]'\n            Possible vars: l_bar, bar, r_bar, n, n_fmt, total, total_fmt,\n              percentage, elapsed, elapsed_s, ncols, nrows, desc, unit,\n              rate, rate_fmt, rate_noinv, rate_noinv_fmt,\n              rate_inv, rate_inv_fmt, postfix, unit_divisor,\n              remaining, remaining_s, eta.\n            Note that a trailing \": \" is automatically removed after {desc}\n            if the latter is empty.\n        postfix  : *, optional\n            Similar to `prefix`, but placed at the end\n            (e.g. for additional stats).\n            Note: postfix is usually a string (not a dict) for this method,\n            and will if possible be set to postfix = ', ' + postfix.\n            However other types are supported (#382).\n        unit_divisor  : float, optional\n            [default: 1000], ignored unless `unit_scale` is True.\n        initial  : int or float, optional\n            The initial counter value [default: 0].\n        colour  : str, optional\n            Bar colour (e.g. 'green', '#00ff00').\n\n        Returns\n        -------\n        out  : Formatted meter and stats, ready to display.\n        \"\"\"\n\n        # sanity check: total\n        if total and (n >= (total + 0.5) or total == float(\"inf\")):\n            # allow float imprecision (#849) or inf (#651)\n            total = None\n\n        # apply custom scale if necessary\n        if unit_scale and unit_scale not in (True, 1):\n            if total:\n                total *= unit_scale\n            n *= unit_scale\n            if rate:\n                rate *= unit_scale  # by default rate = self.avg_dn / self.avg_dt\n            unit_scale = False\n\n        elapsed_str = tqdm.format_interval(elapsed)\n\n        # if unspecified, attempt to use rate = average speed\n        # (we allow manual override since predicting time is an arcane art)\n        if rate is None and elapsed:\n            rate = (n - initial) / elapsed\n        inv_rate = 1 / rate if rate else None\n        format_sizeof = tqdm.format_sizeof\n        rate_noinv_fmt = ((format_sizeof(rate) if unit_scale else f'{rate:5.2f}')\n                          if rate else '?') + unit + '/s'\n        rate_inv_fmt = (\n            (format_sizeof(inv_rate) if unit_scale else f'{inv_rate:5.2f}')\n            if inv_rate else '?') + 's/' + unit\n        rate_fmt = rate_inv_fmt if inv_rate and inv_rate > 1 else rate_noinv_fmt\n\n        if unit_scale:\n            n_fmt = format_sizeof(n, divisor=unit_divisor)\n            total_fmt = format_sizeof(total, divisor=unit_divisor) if total is not None else '?'\n        else:\n            n_fmt = str(n)\n            total_fmt = str(total) if total is not None else '?'\n\n        try:\n            postfix = ', ' + postfix if postfix else ''\n        except TypeError:\n            pass\n\n        remaining = (total - n) / rate if rate and total else 0\n        remaining_str = tqdm.format_interval(remaining) if rate else '?'\n        try:\n            eta_dt = (datetime.now() + timedelta(seconds=remaining)\n                      if rate and total else datetime.fromtimestamp(0, timezone.utc))\n        except OverflowError:\n            eta_dt = datetime.max\n\n        # format the stats displayed to the left and right sides of the bar\n        if prefix:\n            # old prefix setup work around\n            bool_prefix_colon_already = (prefix[-2:] == \": \")\n            l_bar = prefix if bool_prefix_colon_already else prefix + \": \"\n        else:\n            l_bar = ''\n\n        r_bar = f'| {n_fmt}/{total_fmt} [{elapsed_str}<{remaining_str}, {rate_fmt}{postfix}]'\n\n        # Custom bar formatting\n        # Populate a dict with all available progress indicators\n        format_dict = {\n            # slight extension of self.format_dict\n            'n': n, 'n_fmt': n_fmt, 'total': total, 'total_fmt': total_fmt,\n            'elapsed': elapsed_str, 'elapsed_s': elapsed,\n            'ncols': ncols, 'desc': prefix or '', 'unit': unit,\n            'rate': inv_rate if inv_rate and inv_rate > 1 else rate,\n            'rate_fmt': rate_fmt, 'rate_noinv': rate,\n            'rate_noinv_fmt': rate_noinv_fmt, 'rate_inv': inv_rate,\n            'rate_inv_fmt': rate_inv_fmt,\n            'postfix': postfix, 'unit_divisor': unit_divisor,\n            'colour': colour,\n            # plus more useful definitions\n            'remaining': remaining_str, 'remaining_s': remaining,\n            'l_bar': l_bar, 'r_bar': r_bar, 'eta': eta_dt,\n            **extra_kwargs}\n\n        # total is known: we can predict some stats\n        if total:\n            # fractional and percentage progress\n            frac = n / total\n            percentage = frac * 100\n\n            l_bar += f'{percentage:3.0f}%|'\n\n            if ncols == 0:\n                return l_bar[:-1] + r_bar[1:]\n\n            format_dict.update(l_bar=l_bar)\n            if bar_format:\n                format_dict.update(percentage=percentage)\n\n                # auto-remove colon for empty `{desc}`\n                if not prefix:\n                    bar_format = bar_format.replace(\"{desc}: \", '')\n            else:\n                bar_format = \"{l_bar}{bar}{r_bar}\"\n\n            full_bar = FormatReplace()\n            nobar = bar_format.format(bar=full_bar, **format_dict)  # no `{bar}`\n            if not full_bar.format_called:\n                return disp_trim(nobar, ncols) if ncols else nobar\n\n            # Formatting progress bar space available for bar's display\n            full_bar = Bar(frac,\n                           max(1, ncols - disp_len(nobar)) if ncols else 10,\n                           charset=Bar.ASCII if ascii is True else ascii or Bar.UTF,\n                           colour=colour)\n            if not _is_ascii(full_bar.charset) and _is_ascii(bar_format):\n                bar_format = str(bar_format)\n            res = bar_format.format(bar=full_bar, **format_dict)\n            return disp_trim(res, ncols) if ncols else res\n\n        elif bar_format:\n            # user-specified bar_format but no total\n            l_bar += '|'\n            format_dict.update(l_bar=l_bar, percentage=0)\n            full_bar = FormatReplace()\n            nobar = bar_format.format(bar=full_bar, **format_dict)\n            if not full_bar.format_called:\n                return disp_trim(nobar, ncols) if ncols else nobar\n            full_bar = Bar(0,\n                           max(1, ncols - disp_len(nobar)) if ncols else 10,\n                           charset=Bar.BLANK, colour=colour)\n            res = bar_format.format(bar=full_bar, **format_dict)\n            return disp_trim(res, ncols) if ncols else res\n        else:\n            # no total: no bar & ETA, just progress stats\n            res = (f'{(prefix + \": \") if prefix else \"\"}'\n                   f'{n_fmt}{unit} [{elapsed_str}, {rate_fmt}{postfix}]')\n            return disp_trim(res, ncols) if ncols else res"}, {"id": "tqdm.std:tqdm.__new__", "type": "method", "name": "__new__", "qualname": "tqdm.__new__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 664, "end_line": 678, "docstring": null, "code": "    def __new__(cls, *_, **__):\n        instance = object.__new__(cls)\n        with cls.get_lock():  # also constructs lock if non-existent\n            cls._instances.add(instance)\n            # create monitoring thread\n            if cls.monitor_interval and (cls.monitor is None\n                                         or not cls.monitor.report()):\n                try:\n                    cls.monitor = TMonitor(cls, cls.monitor_interval)\n                except Exception as e:  # pragma: nocover\n                    warn(\"tqdm:disabling monitor support\"\n                         \" (monitor_interval = 0) due to:\\n\" + str(e),\n                         TqdmMonitorWarning, stacklevel=2)\n                    cls.monitor_interval = 0\n        return instance"}, {"id": "tqdm.std:tqdm._get_free_pos", "type": "method", "name": "_get_free_pos", "qualname": "tqdm._get_free_pos", "module": "tqdm.std", "file": "tqdm/std.py", "line": 681, "end_line": 685, "docstring": "Skips specified instance.", "code": "    @classmethod\n    def _get_free_pos(cls, instance=None):\n        \"\"\"Skips specified instance.\"\"\"\n        positions = {abs(inst.pos) for inst in cls._instances\n                     if inst is not instance and hasattr(inst, \"pos\")}\n        return min(set(range(len(positions) + 1)).difference(positions))"}, {"id": "tqdm.std:tqdm._decr_instances", "type": "method", "name": "_decr_instances", "qualname": "tqdm._decr_instances", "module": "tqdm.std", "file": "tqdm/std.py", "line": 688, "end_line": 715, "docstring": "Remove from list and reposition another unfixed bar\nto fill the new gap.\n\nThis means that by default (where all nested bars are unfixed),\norder is not maintained but screen flicker/blank space is minimised.\n(tqdm<=4.44.1 moved ALL subsequent unfixed bars up.)", "code": "    @classmethod\n    def _decr_instances(cls, instance):\n        \"\"\"\n        Remove from list and reposition another unfixed bar\n        to fill the new gap.\n\n        This means that by default (where all nested bars are unfixed),\n        order is not maintained but screen flicker/blank space is minimised.\n        (tqdm<=4.44.1 moved ALL subsequent unfixed bars up.)\n        \"\"\"\n        with cls._lock:\n            try:\n                cls._instances.remove(instance)\n            except KeyError:\n                # if not instance.gui:  # pragma: no cover\n                #     raise\n                pass  # py2: maybe magically removed already\n            # else:\n            if not instance.gui:\n                last = (instance.nrows or 20) - 1\n                # find unfixed (`pos >= 0`) overflow (`pos >= nrows - 1`)\n                instances = list(filter(\n                    lambda i: hasattr(i, \"pos\") and last <= i.pos,\n                    cls._instances))\n                # set first found to current `pos`\n                if instances:\n                    inst = min(instances, key=lambda i: i.pos)\n                    inst.clear(nolock=True)\n                    inst.pos = abs(instance.pos)"}, {"id": "tqdm.std:tqdm.write", "type": "method", "name": "write", "qualname": "tqdm.write", "module": "tqdm.std", "file": "tqdm/std.py", "line": 718, "end_line": 726, "docstring": "Print a message via tqdm (without overlap with bars).", "code": "    @classmethod\n    def write(cls, s, file=None, end=\"\\n\", nolock=False):\n        \"\"\"Print a message via tqdm (without overlap with bars).\"\"\"\n        fp = file if file is not None else sys.stdout\n        if fp is None:\n            return\n        with cls.external_write_mode(file=file, nolock=nolock):\n            # Write the message\n            fp.write(s)\n            fp.write(end)"}, {"id": "tqdm.std:tqdm.external_write_mode", "type": "method", "name": "external_write_mode", "qualname": "tqdm.external_write_mode", "module": "tqdm.std", "file": "tqdm/std.py", "line": 730, "end_line": 759, "docstring": "Disable tqdm within context and refresh tqdm when exits.\nUseful when writing to standard output stream", "code": "    @classmethod\n    @contextmanager\n    def external_write_mode(cls, file=None, nolock=False):\n        \"\"\"\n        Disable tqdm within context and refresh tqdm when exits.\n        Useful when writing to standard output stream\n        \"\"\"\n        fp = file if file is not None else sys.stdout\n        if fp is None:\n            yield\n            return\n\n        try:\n            if not nolock:\n                cls.get_lock().acquire()\n            # Clear all bars\n            inst_cleared = []\n            for inst in getattr(cls, '_instances', []):\n                # Clear instance if in the target output file\n                # or if write output + tqdm output are both either\n                # sys.stdout or sys.stderr (because both are mixed in terminal)\n                if hasattr(inst, \"start_t\") and (inst.fp == fp or all(\n                        f in (sys.stdout, sys.stderr) for f in (fp, inst.fp))):\n                    inst.clear(nolock=True)\n                    inst_cleared.append(inst)\n            yield\n            # Force refresh display of bars we cleared\n            for inst in inst_cleared:\n                inst.refresh(nolock=True)\n        finally:\n            if not nolock:\n                cls._lock.release()"}, {"id": "tqdm.std:tqdm.set_lock", "type": "method", "name": "set_lock", "qualname": "tqdm.set_lock", "module": "tqdm.std", "file": "tqdm/std.py", "line": 762, "end_line": 764, "docstring": "Set the global lock.", "code": "    @classmethod\n    def set_lock(cls, lock):\n        \"\"\"Set the global lock.\"\"\"\n        cls._lock = lock"}, {"id": "tqdm.std:tqdm.get_lock", "type": "method", "name": "get_lock", "qualname": "tqdm.get_lock", "module": "tqdm.std", "file": "tqdm/std.py", "line": 767, "end_line": 771, "docstring": "Get the global lock. Construct it if it does not exist.", "code": "    @classmethod\n    def get_lock(cls):\n        \"\"\"Get the global lock. Construct it if it does not exist.\"\"\"\n        if not hasattr(cls, '_lock'):\n            cls._lock = TqdmDefaultWriteLock()\n        return cls._lock"}, {"id": "tqdm.std:tqdm.pandas", "type": "method", "name": "pandas", "qualname": "tqdm.pandas", "module": "tqdm.std", "file": "tqdm/std.py", "line": 774, "end_line": 955, "docstring": "Registers the current `tqdm` class with\n    pandas.core.\n    ( frame.DataFrame\n    | series.Series\n    | groupby.(generic.)DataFrameGroupBy\n    | groupby.(generic.)SeriesGroupBy\n    ).progress_apply\n\nA new instance will be created every time `progress_apply` is called,\nand each instance will automatically `close()` upon completion.\n\nParameters\n----------\ntqdm_kwargs  : arguments for the tqdm instance\n\nExamples\n--------\n>>> import pandas as pd\n>>> import numpy as np\n>>> from tqdm import tqdm\n>>> from tqdm.gui import tqdm as tqdm_gui\n>>>\n>>> df = pd.DataFrame(np.random.randint(0, 100, (100000, 6)))\n>>> tqdm.pandas(ncols=50)  # can use tqdm_gui, optional kwargs, etc\n>>> # Now you can use `progress_apply` instead of `apply`\n>>> df.groupby(0).progress_apply(lambda x: x**2)\n\nReferences\n----------\n<https://stackoverflow.com/questions/18603270/        progress-indicator-during-pandas-operations-python>", "code": "    @classmethod\n    def pandas(cls, **tqdm_kwargs):\n        \"\"\"\n        Registers the current `tqdm` class with\n            pandas.core.\n            ( frame.DataFrame\n            | series.Series\n            | groupby.(generic.)DataFrameGroupBy\n            | groupby.(generic.)SeriesGroupBy\n            ).progress_apply\n\n        A new instance will be created every time `progress_apply` is called,\n        and each instance will automatically `close()` upon completion.\n\n        Parameters\n        ----------\n        tqdm_kwargs  : arguments for the tqdm instance\n\n        Examples\n        --------\n        >>> import pandas as pd\n        >>> import numpy as np\n        >>> from tqdm import tqdm\n        >>> from tqdm.gui import tqdm as tqdm_gui\n        >>>\n        >>> df = pd.DataFrame(np.random.randint(0, 100, (100000, 6)))\n        >>> tqdm.pandas(ncols=50)  # can use tqdm_gui, optional kwargs, etc\n        >>> # Now you can use `progress_apply` instead of `apply`\n        >>> df.groupby(0).progress_apply(lambda x: x**2)\n\n        References\n        ----------\n        <https://stackoverflow.com/questions/18603270/\\\n        progress-indicator-during-pandas-operations-python>\n        \"\"\"\n        from warnings import catch_warnings, simplefilter\n\n        from pandas.core.frame import DataFrame\n        from pandas.core.series import Series\n        try:\n            with catch_warnings():\n                simplefilter(\"ignore\", category=FutureWarning)\n                from pandas import Panel\n        except ImportError:  # pandas>=1.2.0\n            Panel = None\n        Rolling, Expanding = None, None\n        try:  # pandas>=1.0.0\n            from pandas.core.window.rolling import _Rolling_and_Expanding\n        except ImportError:\n            try:  # pandas>=0.18.0\n                from pandas.core.window import _Rolling_and_Expanding\n            except ImportError:  # pandas>=1.2.0\n                try:  # pandas>=1.2.0\n                    from pandas.core.window.expanding import Expanding\n                    from pandas.core.window.rolling import Rolling\n                    _Rolling_and_Expanding = Rolling, Expanding\n                except ImportError:  # pragma: no cover\n                    _Rolling_and_Expanding = None\n        try:  # pandas>=0.25.0\n            from pandas.core.groupby.generic import SeriesGroupBy  # , NDFrameGroupBy\n            from pandas.core.groupby.generic import DataFrameGroupBy\n        except ImportError:  # pragma: no cover\n            try:  # pandas>=0.23.0\n                from pandas.core.groupby.groupby import DataFrameGroupBy, SeriesGroupBy\n            except ImportError:\n                from pandas.core.groupby import DataFrameGroupBy, SeriesGroupBy\n        try:  # pandas>=0.23.0\n            from pandas.core.groupby.groupby import GroupBy\n        except ImportError:  # pragma: no cover\n            from pandas.core.groupby import GroupBy\n\n        try:  # pandas>=0.23.0\n            from pandas.core.groupby.groupby import PanelGroupBy\n        except ImportError:\n            try:\n                from pandas.core.groupby import PanelGroupBy\n            except ImportError:  # pandas>=0.25.0\n                PanelGroupBy = None\n\n        tqdm_kwargs = tqdm_kwargs.copy()\n        deprecated_t = [tqdm_kwargs.pop('deprecated_t', None)]\n\n        def inner_generator(df_function='apply'):\n            def inner(df, func, *args, **kwargs):\n                \"\"\"\n                Parameters\n                ----------\n                df  : (DataFrame|Series)[GroupBy]\n                    Data (may be grouped).\n                func  : function\n                    To be applied on the (grouped) data.\n                **kwargs  : optional\n                    Transmitted to `df.apply()`.\n                \"\"\"\n\n                # Precompute total iterations\n                total = tqdm_kwargs.pop(\"total\", getattr(df, 'ngroups', None))\n                if total is None:  # not grouped\n                    if df_function == 'applymap':\n                        total = df.size\n                    elif isinstance(df, Series):\n                        total = len(df)\n                    elif (_Rolling_and_Expanding is None or\n                          not isinstance(df, _Rolling_and_Expanding)):\n                        # DataFrame or Panel\n                        axis = kwargs.get('axis', 0)\n                        if axis == 'index':\n                            axis = 0\n                        elif axis == 'columns':\n                            axis = 1\n                        # when axis=0, total is shape[axis1]\n                        total = df.size // df.shape[axis]\n\n                # Init bar\n                if deprecated_t[0] is not None:\n                    t = deprecated_t[0]\n                    deprecated_t[0] = None\n                else:\n                    t = cls(total=total, **tqdm_kwargs)\n\n                if len(args) > 0:\n                    # *args intentionally not supported (see #244, #299)\n                    TqdmDeprecationWarning(\n                        \"Except func, normal arguments are intentionally\" +\n                        \" not supported by\" +\n                        \" `(DataFrame|Series|GroupBy).progress_apply`.\" +\n                        \" Use keyword arguments instead.\",\n                        fp_write=getattr(t.fp, 'write', sys.stderr.write))\n\n                try:  # pandas>=1.3.0,<3.0\n                    from pandas.core.common import is_builtin_func\n                except ImportError:  # pandas<1.3.0\n                    is_builtin_func = getattr(df, '_is_builtin_func', lambda f: f)\n                try:\n                    func = is_builtin_func(func)\n                except TypeError:\n                    pass\n\n                # Define bar updating wrapper\n                def wrapper(*args, **kwargs):\n                    # update tbar correctly\n                    # it seems `pandas apply` calls `func` twice\n                    # on the first column/row to decide whether it can\n                    # take a fast or slow code path; so stop when t.total==t.n\n                    t.update(n=1 if not t.total or t.n < t.total else 0)\n                    return func(*args, **kwargs)\n\n                # Apply the provided function (in **kwargs)\n                # on the df using our wrapper (which provides bar updating)\n                try:\n                    return getattr(df, df_function)(wrapper, **kwargs)\n                finally:\n                    t.close()\n\n            return inner\n\n        # Monkeypatch pandas to provide easy methods\n        # Enable custom tqdm progress in pandas!\n        Series.progress_apply = inner_generator()\n        SeriesGroupBy.progress_apply = inner_generator()\n        Series.progress_map = inner_generator('map')\n        SeriesGroupBy.progress_map = inner_generator('map')\n\n        DataFrame.progress_apply = inner_generator()\n        DataFrameGroupBy.progress_apply = inner_generator()\n        DataFrame.progress_applymap = inner_generator('applymap')\n        DataFrame.progress_map = inner_generator('map')\n        DataFrameGroupBy.progress_map = inner_generator('map')\n\n        if Panel is not None:\n            Panel.progress_apply = inner_generator()\n        if PanelGroupBy is not None:\n            PanelGroupBy.progress_apply = inner_generator()\n\n        GroupBy.progress_apply = inner_generator()\n        GroupBy.progress_aggregate = inner_generator('aggregate')\n        GroupBy.progress_transform = inner_generator('transform')\n\n        if Rolling is not None and Expanding is not None:\n            Rolling.progress_apply = inner_generator()\n            Expanding.progress_apply = inner_generator()\n        elif _Rolling_and_Expanding is not None:\n            _Rolling_and_Expanding.progress_apply = inner_generator()"}, {"id": "tqdm.std:tqdm.__init__", "type": "method", "name": "__init__", "qualname": "tqdm.__init__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 960, "end_line": 1108, "docstring": "see tqdm.tqdm for arguments", "code": "    @envwrap(\"tqdm\", is_method=True, types={'total': float, 'ncols': int, 'miniters': float,\n                                            'position': int, 'nrows': int})\n    def __init__(self, iterable=None, desc=None, total=None, leave=True, file=None,\n                 ncols=None, mininterval=0.1, maxinterval=10.0, miniters=None,\n                 ascii=None,  # pylint: disable=redefined-builtin\n                 disable=False, unit='it', unit_scale=False, dynamic_ncols=False, smoothing=0.3,\n                 bar_format=None, initial=0, position=None, postfix=None, unit_divisor=1000,\n                 write_bytes=False, lock_args=None, nrows=None, colour=None, delay=0.0, gui=False,\n                 **kwargs):\n        \"\"\"see tqdm.tqdm for arguments\"\"\"\n        if file is None:\n            file = sys.stderr\n\n        if write_bytes:\n            # Despite coercing unicode into bytes, py2 sys.std* streams\n            # should have bytes written to them.\n            file = SimpleTextIOWrapper(\n                file, encoding=getattr(file, 'encoding', None) or 'utf-8')\n\n        file = DisableOnWriteError(file, tqdm_instance=self)\n\n        if disable is None and hasattr(file, \"isatty\") and not file.isatty():\n            disable = True\n\n        if total is None and iterable is not None:\n            try:\n                total = len(iterable)\n            except (TypeError, AttributeError):\n                total = None\n        if total == float(\"inf\"):\n            total = None  # same as unknown\n\n        if disable:\n            self.iterable = iterable\n            self.disable = disable\n            with self._lock:\n                self.pos = self._get_free_pos(self)\n                self._instances.remove(self)\n            self.n = initial\n            self.total = total\n            self.leave = leave\n            return\n\n        if kwargs:\n            self.disable = True\n            with self._lock:\n                self.pos = self._get_free_pos(self)\n                self._instances.remove(self)\n            raise (\n                TqdmDeprecationWarning(\n                    \"`nested` is deprecated and automated.\\n\"\n                    \"Use `position` instead for manual control.\\n\",\n                    fp_write=getattr(file, 'write', sys.stderr.write))\n                if \"nested\" in kwargs else\n                TqdmKeyError(\"Unknown argument(s): \" + str(kwargs)))\n\n        # Preprocess the arguments\n        if (\n            (ncols is None or nrows is None) and (file in (sys.stderr, sys.stdout))\n        ) or dynamic_ncols:  # pragma: no cover\n            if dynamic_ncols:\n                dynamic_ncols = _screen_shape_wrapper()\n                if dynamic_ncols:\n                    ncols, nrows = dynamic_ncols(file)\n            else:\n                _dynamic_ncols = _screen_shape_wrapper()\n                if _dynamic_ncols:\n                    _ncols, _nrows = _dynamic_ncols(file)\n                    if ncols is None:\n                        ncols = _ncols\n                    if nrows is None:\n                        nrows = _nrows\n\n        if miniters is None:\n            miniters = 0\n            dynamic_miniters = True\n        else:\n            dynamic_miniters = False\n\n        if mininterval is None:\n            mininterval = 0\n\n        if maxinterval is None:\n            maxinterval = 0\n\n        if ascii is None:\n            ascii = not _supports_unicode(file)\n\n        if bar_format and ascii is not True and not _is_ascii(ascii):\n            # Convert bar format into unicode since terminal uses unicode\n            bar_format = str(bar_format)\n\n        if smoothing is None:\n            smoothing = 0\n\n        # Store the arguments\n        self.iterable = iterable\n        self.desc = desc or ''\n        self.total = total\n        self.leave = leave\n        self.fp = file\n        self.ncols = ncols\n        self.nrows = nrows\n        self.mininterval = mininterval\n        self.maxinterval = maxinterval\n        self.miniters = miniters\n        self.dynamic_miniters = dynamic_miniters\n        self.ascii = ascii\n        self.disable = disable\n        self.unit = unit\n        self.unit_scale = unit_scale\n        self.unit_divisor = unit_divisor\n        self.initial = initial\n        self.lock_args = lock_args\n        self.delay = delay\n        self.gui = gui\n        self.dynamic_ncols = dynamic_ncols\n        self.smoothing = smoothing\n        self._ema_dn = EMA(smoothing)\n        self._ema_dt = EMA(smoothing)\n        self._ema_miniters = EMA(smoothing)\n        self.bar_format = bar_format\n        self.postfix = None\n        self.colour = colour\n        self._time = time\n        if postfix:\n            try:\n                self.set_postfix(refresh=False, **postfix)\n            except TypeError:\n                self.postfix = postfix\n\n        # Init the iterations counters\n        self.last_print_n = initial\n        self.n = initial\n\n        # if nested, at initial sp() call we replace '\\r' by '\\n' to\n        # not overwrite the outer progress bar\n        with self._lock:\n            # mark fixed positions as negative\n            self.pos = self._get_free_pos(self) if position is None else -position\n\n        if not gui:\n            # Initialize the screen printer\n            self.sp = self.status_printer(self.fp)\n            if delay <= 0:\n                self.refresh(lock_args=self.lock_args)\n\n        # Init the time counter\n        self.last_print_t = self._time()\n        # NB: Avoid race conditions by setting start_t at the very end of init\n        self.start_t = self.last_print_t"}, {"id": "tqdm.std:tqdm.__bool__", "type": "method", "name": "__bool__", "qualname": "tqdm.__bool__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1110, "end_line": 1115, "docstring": null, "code": "    def __bool__(self):\n        if self.total is not None:\n            return self.total > 0\n        if self.iterable is None:\n            raise TypeError('bool() undefined when iterable == total == None')\n        return bool(self.iterable)"}, {"id": "tqdm.std:tqdm.__len__", "type": "method", "name": "__len__", "qualname": "tqdm.__len__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1117, "end_line": 1123, "docstring": null, "code": "    def __len__(self):\n        return (\n            self.total if self.iterable is None\n            else self.iterable.shape[0] if hasattr(self.iterable, \"shape\")\n            else len(self.iterable) if hasattr(self.iterable, \"__len__\")\n            else self.iterable.__length_hint__() if hasattr(self.iterable, \"__length_hint__\")\n            else getattr(self, \"total\", None))"}, {"id": "tqdm.std:tqdm.__reversed__", "type": "method", "name": "__reversed__", "qualname": "tqdm.__reversed__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1125, "end_line": 1134, "docstring": null, "code": "    def __reversed__(self):\n        try:\n            orig = self.iterable\n        except AttributeError:\n            raise TypeError(\"'tqdm' object is not reversible\")\n        else:\n            self.iterable = reversed(self.iterable)\n            return self.__iter__()\n        finally:\n            self.iterable = orig"}, {"id": "tqdm.std:tqdm.__contains__", "type": "method", "name": "__contains__", "qualname": "tqdm.__contains__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1136, "end_line": 1139, "docstring": null, "code": "    def __contains__(self, item):\n        contains = getattr(self.iterable, '__contains__', None)\n        return (contains(item) if contains is not None  # pylint: disable=not-callable\n                else item in self.__iter__())"}, {"id": "tqdm.std:tqdm.__enter__", "type": "method", "name": "__enter__", "qualname": "tqdm.__enter__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1141, "end_line": 1142, "docstring": null, "code": "    def __enter__(self):\n        return self"}, {"id": "tqdm.std:tqdm.__exit__", "type": "method", "name": "__exit__", "qualname": "tqdm.__exit__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1144, "end_line": 1151, "docstring": null, "code": "    def __exit__(self, exc_type, exc_value, traceback):\n        try:\n            self.close()\n        except AttributeError:\n            # maybe eager thread cleanup upon external error\n            if (exc_type, exc_value, traceback) == (None, None, None):\n                raise\n            warn(\"AttributeError ignored\", TqdmWarning, stacklevel=2)"}, {"id": "tqdm.std:tqdm.__del__", "type": "method", "name": "__del__", "qualname": "tqdm.__del__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1153, "end_line": 1154, "docstring": null, "code": "    def __del__(self):\n        self.close()"}, {"id": "tqdm.std:tqdm.__str__", "type": "method", "name": "__str__", "qualname": "tqdm.__str__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1156, "end_line": 1157, "docstring": null, "code": "    def __str__(self):\n        return self.format_meter(**self.format_dict)"}, {"id": "tqdm.std:tqdm._comparable", "type": "method", "name": "_comparable", "qualname": "tqdm._comparable", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1160, "end_line": 1161, "docstring": null, "code": "    @property\n    def _comparable(self):\n        return abs(getattr(self, \"pos\", 1 << 31))"}, {"id": "tqdm.std:tqdm.__hash__", "type": "method", "name": "__hash__", "qualname": "tqdm.__hash__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1163, "end_line": 1164, "docstring": null, "code": "    def __hash__(self):\n        return id(self)"}, {"id": "tqdm.std:tqdm.__iter__", "type": "method", "name": "__iter__", "qualname": "tqdm.__iter__", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1166, "end_line": 1201, "docstring": "Backward-compatibility to use: for x in tqdm(iterable)", "code": "    def __iter__(self):\n        \"\"\"Backward-compatibility to use: for x in tqdm(iterable)\"\"\"\n\n        # Inlining instance variables as locals (speed optimisation)\n        iterable = self.iterable\n\n        # If the bar is disabled, then just walk the iterable\n        # (note: keep this check outside the loop for performance)\n        if self.disable:\n            yield from iterable\n            return\n\n        mininterval = self.mininterval\n        last_print_t = self.last_print_t\n        last_print_n = self.last_print_n\n        min_start_t = self.start_t + self.delay\n        n = self.n\n        time = self._time\n\n        try:\n            for obj in iterable:\n                yield obj\n                # Update and possibly print the progress bar.\n                # Note: does not call self.update(1) for speed optimisation.\n                n += 1\n\n                if n - last_print_n >= self.miniters:\n                    cur_t = time()\n                    dt = cur_t - last_print_t\n                    if dt >= mininterval and cur_t >= min_start_t:\n                        self.update(n - last_print_n)\n                        last_print_n = self.last_print_n\n                        last_print_t = self.last_print_t\n        finally:\n            self.n = n\n            self.close()"}, {"id": "tqdm.std:tqdm.update", "type": "method", "name": "update", "qualname": "tqdm.update", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1203, "end_line": 1268, "docstring": "Manually update the progress bar, useful for streams\nsuch as reading files.\nE.g.:\n>>> t = tqdm(total=filesize) # Initialise\n>>> for current_buffer in stream:\n...    ...\n...    t.update(len(current_buffer))\n>>> t.close()\nThe last line is highly recommended, but possibly not necessary if\n`t.update()` will be called in such a way that `filesize` will be\nexactly reached and printed.\n\nParameters\n----------\nn  : int or float, optional\n    Increment to add to the internal counter of iterations\n    [default: 1]. If using float, consider specifying `{n:.3f}`\n    or similar in `bar_format`, or specifying `unit_scale`.\n\nReturns\n-------\nout  : bool or None\n    True if a `display()` was triggered.", "code": "    def update(self, n=1):\n        \"\"\"\n        Manually update the progress bar, useful for streams\n        such as reading files.\n        E.g.:\n        >>> t = tqdm(total=filesize) # Initialise\n        >>> for current_buffer in stream:\n        ...    ...\n        ...    t.update(len(current_buffer))\n        >>> t.close()\n        The last line is highly recommended, but possibly not necessary if\n        `t.update()` will be called in such a way that `filesize` will be\n        exactly reached and printed.\n\n        Parameters\n        ----------\n        n  : int or float, optional\n            Increment to add to the internal counter of iterations\n            [default: 1]. If using float, consider specifying `{n:.3f}`\n            or similar in `bar_format`, or specifying `unit_scale`.\n\n        Returns\n        -------\n        out  : bool or None\n            True if a `display()` was triggered.\n        \"\"\"\n        if self.disable:\n            return\n\n        if n < 0:\n            self.last_print_n += n  # for auto-refresh logic to work\n        self.n += n\n\n        # check counter first to reduce calls to time()\n        if self.n - self.last_print_n >= self.miniters:\n            cur_t = self._time()\n            dt = cur_t - self.last_print_t\n            if dt >= self.mininterval and cur_t >= self.start_t + self.delay:\n                cur_t = self._time()\n                dn = self.n - self.last_print_n  # >= n\n                if self.smoothing and dt and dn:\n                    # EMA (not just overall average)\n                    self._ema_dn(dn)\n                    self._ema_dt(dt)\n                self.refresh(lock_args=self.lock_args)\n                if self.dynamic_miniters:\n                    # If no `miniters` was specified, adjust automatically to the\n                    # maximum iteration rate seen so far between two prints.\n                    # e.g.: After running `tqdm.update(5)`, subsequent\n                    # calls to `tqdm.update()` will only cause an update after\n                    # at least 5 more iterations.\n                    if self.maxinterval and dt >= self.maxinterval:\n                        self.miniters = dn * (self.mininterval or self.maxinterval) / dt\n                    elif self.smoothing:\n                        # EMA miniters update\n                        self.miniters = self._ema_miniters(\n                            dn * (self.mininterval / dt if self.mininterval and dt\n                                  else 1))\n                    else:\n                        # max iters between two prints\n                        self.miniters = max(self.miniters, dn)\n\n                # Store old values for next call\n                self.last_print_n = self.n\n                self.last_print_t = cur_t\n                return True"}, {"id": "tqdm.std:tqdm.close", "type": "method", "name": "close", "qualname": "tqdm.close", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1270, "end_line": 1314, "docstring": "Cleanup and (if leave=False) close the progress bar.", "code": "    def close(self):\n        \"\"\"Cleanup and (if leave=False) close the progress bar.\"\"\"\n        if getattr(self, 'disable', True):\n            return\n\n        # Prevent multiple closures\n        self.disable = True\n\n        # decrement instance pos and remove from internal set\n        pos = abs(self.pos)\n        self._decr_instances(self)\n\n        if not hasattr(self, 'last_print_t'):\n            return\n        if self.last_print_t < self.start_t + self.delay:\n            # haven't ever displayed; nothing to clear\n            return\n\n        # GUI mode\n        if getattr(self, 'sp', None) is None:\n            return\n\n        # annoyingly, _supports_unicode isn't good enough\n        def fp_write(s):\n            self.fp.write(str(s))\n\n        try:\n            fp_write('')\n        except ValueError as e:\n            if 'closed' in str(e):\n                return\n            raise  # pragma: no cover\n\n        leave = pos == 0 if self.leave is None else self.leave\n\n        with self._lock:\n            if leave:\n                # stats for overall rate (no weighted average)\n                self._ema_dt = lambda: None\n                self.display(pos=0)\n                fp_write('\\n')\n            else:\n                # clear previous display\n                if self.display(msg='', pos=pos) and not pos:\n                    fp_write('\\r')"}, {"id": "tqdm.std:tqdm.clear", "type": "method", "name": "clear", "qualname": "tqdm.clear", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1316, "end_line": 1330, "docstring": "Clear current bar display.", "code": "    def clear(self, nolock=False):\n        \"\"\"Clear current bar display.\"\"\"\n        if self.disable:\n            return\n\n        if not nolock:\n            self._lock.acquire()\n        pos = abs(self.pos)\n        if pos < (self.nrows or 20):\n            self.moveto(pos)\n            self.sp('')\n            self.fp.write('\\r')  # place cursor back at the beginning of line\n            self.moveto(-pos)\n        if not nolock:\n            self._lock.release()"}, {"id": "tqdm.std:tqdm.refresh", "type": "method", "name": "refresh", "qualname": "tqdm.refresh", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1332, "end_line": 1357, "docstring": "Force refresh the display of this bar.\n\nParameters\n----------\nnolock  : bool, optional\n    If `True`, does not lock.\n    If [default: `False`]: calls `acquire()` on internal lock.\nlock_args  : tuple, optional\n    Passed to internal lock's `acquire()`.\n    If specified, will only `display()` if `acquire()` returns `True`.", "code": "    def refresh(self, nolock=False, lock_args=None):\n        \"\"\"\n        Force refresh the display of this bar.\n\n        Parameters\n        ----------\n        nolock  : bool, optional\n            If `True`, does not lock.\n            If [default: `False`]: calls `acquire()` on internal lock.\n        lock_args  : tuple, optional\n            Passed to internal lock's `acquire()`.\n            If specified, will only `display()` if `acquire()` returns `True`.\n        \"\"\"\n        if self.disable:\n            return\n\n        if not nolock:\n            if lock_args:\n                if not self._lock.acquire(*lock_args):\n                    return False\n            else:\n                self._lock.acquire()\n        self.display()\n        if not nolock:\n            self._lock.release()\n        return True"}, {"id": "tqdm.std:tqdm.unpause", "type": "method", "name": "unpause", "qualname": "tqdm.unpause", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1359, "end_line": 1365, "docstring": "Restart tqdm timer from last print time.", "code": "    def unpause(self):\n        \"\"\"Restart tqdm timer from last print time.\"\"\"\n        if self.disable:\n            return\n        cur_t = self._time()\n        self.start_t += cur_t - self.last_print_t\n        self.last_print_t = cur_t"}, {"id": "tqdm.std:tqdm.reset", "type": "method", "name": "reset", "qualname": "tqdm.reset", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1367, "end_line": 1387, "docstring": "Resets to 0 iterations for repeated use.\n\nConsider combining with `leave=True`.\n\nParameters\n----------\ntotal  : int or float, optional. Total to use for the new bar.", "code": "    def reset(self, total=None):\n        \"\"\"\n        Resets to 0 iterations for repeated use.\n\n        Consider combining with `leave=True`.\n\n        Parameters\n        ----------\n        total  : int or float, optional. Total to use for the new bar.\n        \"\"\"\n        self.n = 0\n        if total is not None:\n            self.total = None if total == float(\"inf\") else total\n        if self.disable:\n            return\n        self.last_print_n = 0\n        self.last_print_t = self.start_t = self._time()\n        self._ema_dn = EMA(self.smoothing)\n        self._ema_dt = EMA(self.smoothing)\n        self._ema_miniters = EMA(self.smoothing)\n        self.refresh()"}, {"id": "tqdm.std:tqdm.set_description", "type": "method", "name": "set_description", "qualname": "tqdm.set_description", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1389, "end_line": 1401, "docstring": "Set/modify description of the progress bar.\n\nParameters\n----------\ndesc  : str, optional\nrefresh  : bool, optional\n    Forces refresh [default: True].", "code": "    def set_description(self, desc=None, refresh=True):\n        \"\"\"\n        Set/modify description of the progress bar.\n\n        Parameters\n        ----------\n        desc  : str, optional\n        refresh  : bool, optional\n            Forces refresh [default: True].\n        \"\"\"\n        self.desc = desc + ': ' if desc else ''\n        if refresh:\n            self.refresh()"}, {"id": "tqdm.std:tqdm.set_description_str", "type": "method", "name": "set_description_str", "qualname": "tqdm.set_description_str", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1403, "end_line": 1407, "docstring": "Set/modify description without ': ' appended.", "code": "    def set_description_str(self, desc=None, refresh=True):\n        \"\"\"Set/modify description without ': ' appended.\"\"\"\n        self.desc = desc or ''\n        if refresh:\n            self.refresh()"}, {"id": "tqdm.std:tqdm.set_postfix", "type": "method", "name": "set_postfix", "qualname": "tqdm.set_postfix", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1409, "end_line": 1438, "docstring": "Set/modify postfix (additional stats)\nwith automatic formatting based on datatype.\n\nParameters\n----------\nordered_dict  : dict or OrderedDict, optional\nrefresh  : bool, optional\n    Forces refresh [default: True].\nkwargs  : dict, optional", "code": "    def set_postfix(self, ordered_dict=None, refresh=True, **kwargs):\n        \"\"\"\n        Set/modify postfix (additional stats)\n        with automatic formatting based on datatype.\n\n        Parameters\n        ----------\n        ordered_dict  : dict or OrderedDict, optional\n        refresh  : bool, optional\n            Forces refresh [default: True].\n        kwargs  : dict, optional\n        \"\"\"\n        # Sort in alphabetical order to be more deterministic\n        postfix = OrderedDict([] if ordered_dict is None else ordered_dict)\n        for key in sorted(kwargs.keys()):\n            postfix[key] = kwargs[key]\n        # Preprocess stats according to datatype\n        for key in postfix.keys():\n            # Number: limit the length of the string\n            if isinstance(postfix[key], Number):\n                postfix[key] = self.format_num(postfix[key])\n            # Else for any other type, try to get the string conversion\n            elif not isinstance(postfix[key], str):\n                postfix[key] = str(postfix[key])\n            # Else if it's a string, don't need to preprocess anything\n        # Stitch together to get the final postfix\n        self.postfix = ', '.join(key + '=' + postfix[key].strip()\n                                 for key in postfix.keys())\n        if refresh:\n            self.refresh()"}, {"id": "tqdm.std:tqdm.set_postfix_str", "type": "method", "name": "set_postfix_str", "qualname": "tqdm.set_postfix_str", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1440, "end_line": 1446, "docstring": "Postfix without dictionary expansion, similar to prefix handling.", "code": "    def set_postfix_str(self, s='', refresh=True):\n        \"\"\"\n        Postfix without dictionary expansion, similar to prefix handling.\n        \"\"\"\n        self.postfix = str(s)\n        if refresh:\n            self.refresh()"}, {"id": "tqdm.std:tqdm.moveto", "type": "method", "name": "moveto", "qualname": "tqdm.moveto", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1448, "end_line": 1451, "docstring": null, "code": "    def moveto(self, n):\n        # TODO: private method\n        self.fp.write('\\n' * n + _term_move_up() * -n)\n        getattr(self.fp, 'flush', lambda: None)()"}, {"id": "tqdm.std:tqdm.format_dict", "type": "method", "name": "format_dict", "qualname": "tqdm.format_dict", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1454, "end_line": 1469, "docstring": "Public API for read-only member access.", "code": "    @property\n    def format_dict(self):\n        \"\"\"Public API for read-only member access.\"\"\"\n        if self.disable and not hasattr(self, 'unit'):\n            return defaultdict(lambda: None, {\n                'n': self.n, 'total': self.total, 'elapsed': 0, 'unit': 'it'})\n        if self.dynamic_ncols:\n            self.ncols, self.nrows = self.dynamic_ncols(self.fp)\n        return {\n            'n': self.n, 'total': self.total,\n            'elapsed': self._time() - self.start_t if hasattr(self, 'start_t') else 0,\n            'ncols': self.ncols, 'nrows': self.nrows, 'prefix': self.desc,\n            'ascii': self.ascii, 'unit': self.unit, 'unit_scale': self.unit_scale,\n            'rate': self._ema_dn() / self._ema_dt() if self._ema_dt() else None,\n            'bar_format': self.bar_format, 'postfix': self.postfix,\n            'unit_divisor': self.unit_divisor, 'initial': self.initial,\n            'colour': self.colour}"}, {"id": "tqdm.std:tqdm.display", "type": "method", "name": "display", "qualname": "tqdm.display", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1471, "end_line": 1505, "docstring": "Use `self.sp` to display `msg` in the specified `pos`.\n\nConsider overloading this function when inheriting to use e.g.:\n`self.some_frontend(**self.format_dict)` instead of `self.sp`.\n\nParameters\n----------\nmsg  : str, optional. What to display (default: `repr(self)`).\npos  : int, optional. Position to `moveto`\n  (default: `abs(self.pos)`).", "code": "    def display(self, msg=None, pos=None):\n        \"\"\"\n        Use `self.sp` to display `msg` in the specified `pos`.\n\n        Consider overloading this function when inheriting to use e.g.:\n        `self.some_frontend(**self.format_dict)` instead of `self.sp`.\n\n        Parameters\n        ----------\n        msg  : str, optional. What to display (default: `repr(self)`).\n        pos  : int, optional. Position to `moveto`\n          (default: `abs(self.pos)`).\n        \"\"\"\n        if pos is None:\n            pos = abs(self.pos)\n\n        nrows = self.nrows or 20\n        if pos >= nrows - 1:\n            if pos >= nrows:\n                return False\n            if msg or msg is None:  # override at `nrows - 1`\n                msg = \" ... (more hidden) ...\"\n\n        if not hasattr(self, \"sp\"):\n            raise TqdmDeprecationWarning(\n                \"Please use `tqdm.gui.tqdm(...)`\"\n                \" instead of `tqdm(..., gui=True)`\\n\",\n                fp_write=getattr(self.fp, 'write', sys.stderr.write))\n\n        if pos:\n            self.moveto(pos)\n        self.sp(self.__str__() if msg is None else msg)\n        if pos:\n            self.moveto(-pos)\n        return True"}, {"id": "tqdm.std:tqdm.wrapattr", "type": "method", "name": "wrapattr", "qualname": "tqdm.wrapattr", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1509, "end_line": 1527, "docstring": "stream  : file-like object.\nmethod  : str, \"read\" or \"write\". The result of `read()` and\n    the first argument of `write()` should have a `len()`.\n\n>>> with tqdm.wrapattr(file_obj, \"read\", total=file_obj.size) as fobj:\n...     while True:\n...         chunk = fobj.read(chunk_size)\n...         if not chunk:\n...             break", "code": "    @classmethod\n    @contextmanager\n    def wrapattr(cls, stream, method, total=None, bytes=True,  # pylint: disable=redefined-builtin\n                 **tqdm_kwargs):\n        \"\"\"\n        stream  : file-like object.\n        method  : str, \"read\" or \"write\". The result of `read()` and\n            the first argument of `write()` should have a `len()`.\n\n        >>> with tqdm.wrapattr(file_obj, \"read\", total=file_obj.size) as fobj:\n        ...     while True:\n        ...         chunk = fobj.read(chunk_size)\n        ...         if not chunk:\n        ...             break\n        \"\"\"\n        with cls(total=total, **tqdm_kwargs) as t:\n            if bytes:\n                t.unit = \"B\"\n                t.unit_scale = True\n                t.unit_divisor = 1024\n            yield CallbackIOWrapper(t.update, stream, method)"}, {"id": "tqdm.std:trange", "type": "function", "name": "trange", "qualname": "trange", "module": "tqdm.std", "file": "tqdm/std.py", "line": 1530, "end_line": 1532, "docstring": "Shortcut for tqdm(range(*args), **kwargs).", "code": "def trange(*args, **kwargs):\n    \"\"\"Shortcut for tqdm(range(*args), **kwargs).\"\"\"\n    return tqdm(range(*args), **kwargs)"}, {"id": "tqdm.tk", "type": "module", "name": "tk", "qualname": "tqdm.tk", "module": "tqdm.tk", "file": "tqdm/tk.py", "line": 1, "end_line": 196, "docstring": "Tkinter GUI progress bar decorator for iterators.\n\nUsage:\n>>> from tqdm.tk import trange, tqdm\n>>> for i in trange(10):\n...     ...", "code": "\"\"\"\nTkinter GUI progress bar decorator for iterators.\n\nUsage:\n>>> from tqdm.tk import trange, tqdm\n>>> for i in trange(10):\n...     ...\n\"\"\"\nimport re\nimport sys\nimport tkinter\nimport tkinter.ttk as ttk\nfrom warnings import warn\n\nfrom .std import TqdmExperimentalWarning, TqdmWarning\nfrom .std import tqdm as std_tqdm\n\n__author__ = {\"github.com/\": [\"richardsheridan\", \"casperdcl\"]}\n__all__ = ['tqdm_tk', 'ttkrange', 'tqdm', 'trange']\n\n\nclass tqdm_tk(std_tqdm):  # pragma: no cover\n    \"\"\"\n    Experimental Tkinter GUI version of tqdm!\n\n    Note: Window interactivity suffers if `tqdm_tk` is not running within\n    a Tkinter mainloop and values are generated infrequently. In this case,\n    consider calling `tqdm_tk.refresh()` frequently in the Tk thread.\n    \"\"\"\n\n    # TODO: @classmethod: write()?\n\n    def __init__(self, *args, **kwargs):\n        \"\"\"\n        This class accepts the following parameters *in addition* to\n        the parameters accepted by `tqdm`.\n\n        Parameters\n        ----------\n        grab  : bool, optional\n            Grab the input across all windows of the process.\n        tk_parent  : `tkinter.Wm`, optional\n            Parent Tk window.\n        cancel_callback  : Callable, optional\n            Create a cancel button and set `cancel_callback` to be called\n            when the cancel or window close button is clicked.\n        \"\"\"\n        kwargs = kwargs.copy()\n        kwargs['gui'] = True\n        # convert disable = None to False\n        kwargs['disable'] = bool(kwargs.get('disable', False))\n        self._warn_leave = 'leave' in kwargs\n        grab = kwargs.pop('grab', False)\n        tk_parent = kwargs.pop('tk_parent', None)\n        self._cancel_callback = kwargs.pop('cancel_callback', None)\n        super().__init__(*args, **kwargs)\n\n        if self.disable:\n            return\n\n        if tk_parent is None:  # Discover parent widget\n            try:\n                tk_parent = tkinter._default_root\n            except AttributeError:\n                raise AttributeError(\n                    \"`tk_parent` required when using `tkinter.NoDefaultRoot()`\")\n            if tk_parent is None:  # use new default root window as display\n                self._tk_window = tkinter.Tk()\n            else:  # some other windows already exist\n                self._tk_window = tkinter.Toplevel()\n        else:\n            self._tk_window = tkinter.Toplevel(tk_parent)\n\n        warn(\"GUI is experimental/alpha\", TqdmExperimentalWarning, stacklevel=2)\n        self._tk_dispatching = self._tk_dispatching_helper()\n\n        self._tk_window.protocol(\"WM_DELETE_WINDOW\", self.cancel)\n        self._tk_window.wm_title(self.desc)\n        self._tk_window.wm_attributes(\"-topmost\", 1)\n        self._tk_window.after(0, lambda: self._tk_window.wm_attributes(\"-topmost\", 0))\n        self._tk_n_var = tkinter.DoubleVar(self._tk_window, value=0)\n        self._tk_text_var = tkinter.StringVar(self._tk_window)\n        pbar_frame = ttk.Frame(self._tk_window, padding=5)\n        pbar_frame.pack()\n        _tk_label = ttk.Label(pbar_frame, textvariable=self._tk_text_var,\n                              wraplength=600, anchor=\"center\", justify=\"center\")\n        _tk_label.pack()\n        self._tk_pbar = ttk.Progressbar(\n            pbar_frame, variable=self._tk_n_var, length=450)\n        if self.total is not None:\n            self._tk_pbar.configure(maximum=self.total)\n        else:\n            self._tk_pbar.configure(mode=\"indeterminate\")\n        self._tk_pbar.pack()\n        if self._cancel_callback is not None:\n            _tk_button = ttk.Button(pbar_frame, text=\"Cancel\", command=self.cancel)\n            _tk_button.pack()\n        if grab:\n            self._tk_window.grab_set()\n\n    def close(self):\n        if self.disable:\n            return\n\n        self.disable = True\n\n        with self.get_lock():\n            self._instances.remove(self)\n\n        def _close():\n            self._tk_window.after('idle', self._tk_window.destroy)\n            if not self._tk_dispatching:\n                self._tk_window.update()\n\n        self._tk_window.protocol(\"WM_DELETE_WINDOW\", _close)\n\n        # if leave is set but we are self-dispatching, the left window is\n        # totally unresponsive unless the user manually dispatches\n        if not self.leave:\n            _close()\n        elif not self._tk_dispatching:\n            if self._warn_leave:\n                warn(\"leave flag ignored if not in tkinter mainloop\",\n                     TqdmWarning, stacklevel=2)\n            _close()\n\n    def clear(self, *_, **__):\n        pass\n\n    def display(self, *_, **__):\n        self._tk_n_var.set(self.n)\n        d = self.format_dict\n        # remove {bar}\n        d['bar_format'] = (d['bar_format'] or \"{l_bar}<bar/>{r_bar}\").replace(\n            \"{bar}\", \"<bar/>\")\n        msg = self.format_meter(**d)\n        if '<bar/>' in msg:\n            msg = \"\".join(re.split(r'\\|?<bar/>\\|?', msg, maxsplit=1))\n        self._tk_text_var.set(msg)\n        if not self._tk_dispatching:\n            self._tk_window.update()\n\n    def set_description(self, desc=None, refresh=True):\n        self.set_description_str(desc, refresh)\n\n    def set_description_str(self, desc=None, refresh=True):\n        self.desc = desc\n        if not self.disable:\n            self._tk_window.wm_title(desc)\n            if refresh and not self._tk_dispatching:\n                self._tk_window.up      pass\n            except ValueError as e:\n                if 'closed' not in str(e):\n                    raise\n                try:\n                    tqdm_instance.miniters = float('inf')\n                except ReferenceError:\n                    pass\n        return inner\n\n    def __init__(self, wrapped, tqdm_instance):  # noqa: B042\n        super().__init__(wrapped)\n        if hasattr(wrapped, 'write'):\n            self.wrapper_setattr(\n                'write', self.disable_on_exception(tqdm_instance, wrapped.write))\n        if hasattr(wrapped, 'flush'):\n            self.wrapper_setattr(\n                'flush', self.disable_on_exception(tqdm_instance, wrapped.flush))\n\n    def __eq__(self, other):\n        return self._wrapped == getattr(other, '_wrapped', other)"}, {"id": "tqdm.utils:DisableOnWriteError.disable_on_exception", "type": "method", "name": "disable_on_exception", "qualname": "DisableOnWriteError.disable_on_exception", "module": "tqdm.utils", "file": "tqdm/utils.py", "line": 171, "end_line": 194, "docstring": "Quietly set `tqdm_instance.miniters=inf` if `func` raises `errno=5`.", "code": "    @staticmethod\n    def disable_on_exception(tqdm_instance, func):\n        \"\"\"\n        Quietly set `tqdm_instance.miniters=inf` if `func` raises `errno=5`.\n        \"\"\"\n        tqdm_instance = proxy(tqdm_instance)\n\n        def inner(*args, **kwargs):\n            try:\n                return func(*args, **kwargs)\n            except OSError as e:\n                if e.errno != 5:\n                    raise\n                try:\n                    tqdm_instance.miniters = float('inf')\n                except ReferenceError:\n                    pass\n            except ValueError as e:\n                if 'closed' not in str(e):\n                    raise\n                try:\n                    tqdm_instance.miniters = float('inf')\n                except ReferenceError:\n                    pass\n        return inner"}, {"id" eturn data\n            self.wrapper_setattr('read', read)\n        else:\n            raise KeyError(\"Can only wrap read/write methods\")"}, {"id": "tqdm.utils:CallbackIOWrapper.__init__", "type": "method", "name": "__init__", "qualname": "CallbackIOWrapper.__init__", "module": "tqdm.utils", "file": "tqdm/utils.py", "line": 210, "end_line": 232, "docstring": "Wrap a given `file`-like object's `read()` or `write()` to report\nlengths to the given `callback`", "code": "    def __init__(self, callback, stream, method=\"read\"):\n        \"\"\"\n        Wrap a given `file`-like object's `read()` or `write()` to report\n        lengths to the given `callback`\n        \"\"\"\n        super().__init__(stream)\n        func = getattr(stream, method)\n        if method == \"write\":\n            @wraps(func)\n            def write(data, *args, **kwargs):\n                res = func(data, *args, **kwargs)\n                callback(len(data))\n                return res\n            self.wrapper_setattr('write', write)\n        elif method == \"read\":\n            @wraps(func)\n            def read(*args, **kwargs):\n                data = func(*args, **kwargs)\n                callback(len(data))\n                return data\n            self.wrapper_setattr('read', read)\n        else:\n            raise KeyError(\"Can only wrap read/write methods\")"}, {"id": "tqdm.utils:_is_utf", "type": "function", "name": "_is_utf", "qualname": "_is_utf", "module": "tqdm.utils", "file": "tqdm/utils.py", "line": 235, "end_line": 246, "docstring": null, "code": "def _is_utf(encoding):\n    try:\n        '\\u2588\\u2589'.encode(encoding)\n    except UnicodeEncodeError:\n        return False\n    except Exception:\n        try:\n            return encoding.lower().startswith('utf-') or ('U8' == encoding)\n        except Exception:\n            return False\n    else:\n        return True"}, {"id": "tqdm.utils:_supports_unicode", "type": "function", "name": "_supports_unicode", "qualname" const NCOL = {module:"#8250df", class:"#0969da", function:"#1a7f37", method:"#bf8700"};
const ECOL = {calls:"#8c959f", inherits:"#cf222e", imports:"#0969da", defines:"#d0d7de"};
const deg = {}; G.edges.forEach(e => { deg[e.source]=(deg[e.source]||0)+1; deg[e.target]=(deg[e.target]||0)+1; });
const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
const nodes = new vis.DataSet(G.nodes.map(n => ({
  id:n.id, label:n.type==="module" ? n.qualname : n.name, type:n.type, color:NCOL[n.type],

function box(host, obj, key) {
  Object.keys(obj).forEach(k => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" ${obj[k]?"checked":""}><span class="sw" style="background:${(key==="n"?NCOL:ECOL)[k]}"></span>${k}`;
    l.firstChild.onchange = ev => { obj[k] = ev.target.checked; (key==="n"?nview:eview).refresh(); };
    document.getElementById(host).appendChild(l);
  });
}
box("ntypes", showN, "n"); box("etypes", showE, "e");
document.getElementById("stats").textContent = Object.entries(G.stats.nodes).map(([k,v]) => v+" "+k).join(" · ");

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function neigh(id, dir) {
  return G.edges.filter(e => (dir==="out" ? e.source : e.target) === id && e.type !== "defines")
    .map(e => `<li>${e.type} → <a data-id="${dir==="out"?e.target:e.source}">${esc(dir==="out"?e.target:e.source)}</a></li>`).join("") || "<li class=mut>nessuno</li>";
}
function select(id) {
  const n = byId[id]; if (!n) return;
  const code = n.type === "module" ? "(modulo: codice omesso)" : n.code;
  document.getElementById("detail").innerHTML =
    `<b>${esc(n.id)}</b><div class="mut">${n.type} · ${n.file}:${n.line}-${n.end_line}</div>` +
    (n.docstring ? `<p>${esc(n.docstring.split("\n\n")[0])}</p>` : "") +
    `<b>Chiama / importa / eredita</b><ul>${neigh(id,"out")}</ul><b>Usato da</b><ul>${neigh(id,"in")}</ul><pre>${esc(code)}</pre>`;

}
function focus(id) { net.selectNodes([id]); net.focus(id, {scale:1.1, animation:true}); select(id); }
net.on("click", p => p.nodes.length && select(p.nodes[0]));

  if (!p.nodes.length) return;
  const keep = new Set([p.nodes[0]]);
  G.edges.forEach(e => { if (e.source===p.nodes[0]) keep.add(e.target); if (e.target===p.nodes[0]) keep.add(e.source); });
  nodes.update(G.nodes.map(n => ({id:n.id, hidden:!keep.has(n.id)})));

document.getElementById("q").oninput = ev => {
  const s = ev.target.value.toLowerCase(); if (s.length < 2) return;
  const hit = G.nodes.find(n => n.id.toLowerCase().includes(s)); if (hit) focus(hit.id);
